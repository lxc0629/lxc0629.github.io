  <script type="module">

import { createElement } from "../libs/react.js";
import { createRoot } from "../libs/react.js";
import { HostChromeProvider, webChrome } from "../pico.js";

import { useEffect, useMemo } from "../libs/react.js";

import { PlaygroundShell, Widget } from "../pico.js";
import { useProgram } from "../pico.js";
import { PicoWorldCard, picoWorldProgram, picoWorldHistory, picoWorldPosition } from "../world.js";
import { jsx } from "../libs/react.js";
var STARTER = `# \u6BCF\u5C42\u5411\u5185\u6536\u4E00\u683C\uFF0C\u5806\u51FA\u4E00\u5EA7\u4E94\u5C42\u7802\u5CA9\u91D1\u5B57\u5854\u3002
for layer in range(5):
    radius = 4 - layer
    for x in range(-radius, radius + 1):
        for y in range(-radius, radius + 1):
            drop(x, y, "sandstone")

# \u7ED9\u5854\u5C16\u52A0\u4E0A\u4E00\u5757\u91D1\u8272\u7684\u9876\u77F3\u3002
drop(0, 0, "gold_block")
`;
var EMPTY_HISTORY = { length: 0, at() {
  throw new RangeError("Empty world");
} };
function Root() {
  const model = useMemo(() => {
    const source = createState(STARTER);
    return { source, request: derive([source], picoWorldProgram) };
  }, []);
  const program = useProgram(model.request, model.source.set, { stepMs: 400 });
  const run = program?.run;
  useEffect(() => {
    if (!run) return;
    const timer = setTimeout(run, 0);
    return () => clearTimeout(timer);
  }, [run]);

      id: "picoworld",
      source: model.source,
      onResetEditor: program.resetEditor,
      initialOpen: ["viz"],

        { key: "debug", icon: "debug", title: "\u8C03\u8BD5", content: /* @__PURE__ */ jsx(Widget, { widget: program.debugger }) },
        { key: "output", icon: "output", title: "\u8F93\u51FA", content: /* @__PURE__ */ jsx(Widget, { widget: program.terminal }) }
