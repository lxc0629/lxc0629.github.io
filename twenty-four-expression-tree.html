<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>24 点表达式计算树</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
</style>
<style>/* Pico VI：.pico-page + .pico-shell 为标准骨架；课程局部样式使用 pico-world-<id> 前缀。 */

@font-face {
  font-family: "Pico WenKai 103";
  src: url("./fonts/lxgwwenkaiscreen-subset-103.woff2") format("woff2");
  font-display: swap;
}
@font-face { font-family: "Pico WenKai 105"; src: url("./fonts/lxgwwenkaiscreen-subset-105.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 108"; src: url("./fonts/lxgwwenkaiscreen-subset-108.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 111"; src: url("./fonts/lxgwwenkaiscreen-subset-111.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 112"; src: url("./fonts/lxgwwenkaiscreen-subset-112.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 113"; src: url("./fonts/lxgwwenkaiscreen-subset-113.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 114"; src: url("./fonts/lxgwwenkaiscreen-subset-114.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 115"; src: url("./fonts/lxgwwenkaiscreen-subset-115.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 116"; src: url("./fonts/lxgwwenkaiscreen-subset-116.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 117"; src: url("./fonts/lxgwwenkaiscreen-subset-117.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 118"; src: url("./fonts/lxgwwenkaiscreen-subset-118.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 119"; src: url("./fonts/lxgwwenkaiscreen-subset-119.woff2") format("woff2"); font-display: swap; }

:root {
  color-scheme: light dark;
  --pico-paper: #fbfbfa;
  --pico-surface: #f3f3f1;
  --pico-surface-raised: #ffffff;
  --pico-ink: #202022;
  --pico-ink-soft: #66666d;
  --pico-hairline: #d9d9d5;
  --pico-accent: #6d4aff;
  --pico-accent-deep: #5535da;
  --pico-accent-wash: #eeeaff;
  --pico-on-accent: #ffffff;
  --pico-card-red: #b4233a;
  --pico-code-bg: #f7f7f5;
  --pico-code-ink: var(--pico-ink);
  --pico-code-dim: #a0a09d;
  --pico-syn-key: #6d4aff;
  --pico-syn-fn: #4f46a5;
  --pico-syn-str: #287058;
  --pico-syn-num: #9a5b13;
  --pico-syn-com: #74747a;
  --pico-font-text: "Pico WenKai 103", "Pico WenKai 105", "Pico WenKai 108",
    "Pico WenKai 111", "Pico WenKai 112",
    "Pico WenKai 113", "Pico WenKai 114", "Pico WenKai 115",
    "Pico WenKai 116", "Pico WenKai 117", "Pico WenKai 118",
    "Pico WenKai 119", "LXGW WenKai Screen", "LXGW WenKai", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --pico-font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --pico-font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo,
    Consolas, "LXGW WenKai Screen", "LXGW WenKai", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", monospace;
  --pico-size-xs: 13px;
  --pico-size-sm: 15px;
  --pico-size-code: 16px;
  --pico-size-md: 18px;
  --pico-size-lg: 22px;
  --pico-size-xl: 30px;
  --pico-space-1: 4px;
  --pico-space-2: 8px;
  --pico-space-3: 12px;
  --pico-space-4: 16px;
  --pico-space-5: 24px;
  --pico-space-6: 40px;
  --pico-radius-sm: 3px;
  --pico-radius: 6px;
  --pico-line: 1px solid var(--pico-hairline);
  --pico-shadow: 0 1px 3px rgba(32, 32, 34, .08);
  --pico-ease-out: cubic-bezier(.2, .8, .2, 1);
  --pico-duration-fast: 140ms;
  --pico-duration-move: 240ms;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-pico-theme="light"]) {
    --pico-paper: #151516;
    --pico-surface: #1d1d20;
    --pico-surface-raised: #242428;
    --pico-ink: #f1f0ee;
    --pico-ink-soft: #b5b3b8;
    --pico-hairline: #46464c;
    --pico-accent: #a78bfa;
    --pico-accent-deep: #c4b5fd;
    --pico-accent-wash: rgba(167, 139, 250, .16);
    --pico-on-accent: #22133d;
    --pico-card-red: #ff91a4;
    --pico-code-bg: #111113;
    --pico-code-dim: #7e7e86;
    --pico-syn-key: #d2a8ff;
    --pico-syn-fn: #b9a1ff;
    --pico-syn-str: #8ddbaf;
    --pico-syn-num: #e6b86b;
    --pico-syn-com: #92929a;
    --pico-shadow: 0 1px 3px rgba(0, 0, 0, .3);
  }
}

:root[data-pico-theme="dark"] {
  --pico-paper: #151516;
  --pico-surface: #1d1d20;
  --pico-surface-raised: #242428;
  --pico-ink: #f1f0ee;
  --pico-ink-soft: #b5b3b8;
  --pico-hairline: #46464c;
  --pico-accent: #a78bfa;
  --pico-accent-deep: #c4b5fd;
  --pico-accent-wash: rgba(167, 139, 250, .16);
  --pico-on-accent: #22133d;
  --pico-card-red: #ff91a4;
  --pico-code-bg: #111113;
  --pico-code-dim: #7e7e86;
  --pico-syn-key: #d2a8ff;
  --pico-syn-fn: #b9a1ff;
  --pico-syn-str: #8ddbaf;
  --pico-syn-num: #e6b86b;
  --pico-syn-com: #92929a;
  --pico-shadow: 0 1px 3px rgba(0, 0, 0, .3);
}

* { box-sizing: border-box; }

.pico-root {
  margin: 0;
  color: var(--pico-ink);
  background: var(--pico-paper);
  font: var(--pico-size-md)/1.65 var(--pico-font-text);
}

.pico-root ::selection { background: var(--pico-accent-wash); }
.pico-root button,
.pico-root input,
.pico-root select { font: inherit; }

.pico-root button:focus-visible,
.pico-root input:focus-visible,
.pico-root select:focus-visible {
  outline: 2px solid var(--pico-accent);
  outline-offset: 3px;
}

/* 公共讲义骨架 */
.pico-page {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  padding: 18px;
  background: var(--pico-paper);
}

.pico-shell {
  display: grid;
  grid-template-columns: 43fr 57fr;
  grid-template-rows: minmax(0, 1fr);
  width: 100%;
  height: 100%;
  overflow: hidden;
  border: var(--pico-line);
  border-radius: var(--pico-radius);
  background: var(--pico-surface-raised);
}

.pico-shell--world-only { grid-template-columns: minmax(0, 1fr); }

.pico-code,
.pico-world {
  display: flex;
  min-width: 0;
  min-height: 0;
  flex-direction: column;
}

.pico-code {
  border-right: var(--pico-line);
  background: var(--pico-code-bg);
}

.pico-editor {
  flex: 1;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

.pico-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 44px;
  padding: 0 var(--pico-space-4);
  background: var(--pico-paper);
}

.pico-panel-title {
  margin: 0;
  color: var(--pico-ink-soft);
  font: 600 var(--pico-size-lg)/1 var(--pico-font-text);
}

.pico-panel-title--world {
  color: var(--pico-ink);
}

.pico-panel-actions {
  display: flex;
  align-items: center;
  gap: var(--pico-space-2);
}

/* 编辑器外观。CodeMirror 主题应映射到同一批 token。 */
.pico-w-editor-host {
  display: flex;
  flex: 1;
  width: 100%;
  height: 100%;
  min-height: 0;
  min-width: 0;
  position: relative;
  overflow: hidden;
}

.pico-w-editor-host .cm-editor {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  min-height: 0;
  min-width: 0;
  flex: 1;
}

.pico-w-editor-host .cm-scroller {
  overflow: auto;
}

.pico-tools,
.pico-functions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: var(--pico-space-3) var(--pico-space-4);
  border-top: var(--pico-line);
  background: var(--pico-surface);
}

.pico-function {
  min-height: 28px;
  padding: 4px 8px;
  border: 1px solid transparent;
  border-radius: var(--pico-radius-sm);
  color: color-mix(in srgb, var(--pico-accent-deep) 52%, var(--pico-ink-soft));
  background: color-mix(in srgb, var(--pico-accent-wash) 52%, var(--pico-surface));
  cursor: pointer;
  font: 500 var(--pico-size-xs)/1.2 var(--pico-font-mono);
  transition: border-color var(--pico-duration-fast), background var(--pico-duration-fast), transform 80ms;
}

.pico-function:hover { border-color: color-mix(in srgb, var(--pico-accent) 28%, var(--pico-hairline)); background: color-mix(in srgb, var(--pico-accent-wash) 72%, var(--pico-surface)); }
.pico-function:active { transform: translateY(1px); }

.pico-status {
  display: inline-flex;
  min-height: 28px;
  align-items: center;
  padding: 4px 8px;
  border: var(--pico-line);
  border-radius: var(--pico-radius-sm);
  color: var(--pico-ink-soft);
  background: var(--pico-surface);
  font: 500 var(--pico-size-xs)/1.2 var(--pico-font-ui);
}

.pico-status-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--pico-space-2);
  padding: var(--pico-space-2) var(--pico-space-4);
  border-bottom: var(--pico-line);
  background: var(--pico-surface);
}

/* input/output、错误与预览也是跨课程公共能力。 */
.pico-io {
  padding: var(--pico-space-3) var(--pico-space-4);
  border-top: var(--pico-line);
  background: var(--pico-paper);
  font: var(--pico-size-md)/1.6 var(--pico-font-text);
}

.pico-io-row { min-height: 1.6em; white-space: pre-wrap; overflow-wrap: anywhere; }
.pico-io-stderr { color: var(--pico-accent-deep); }
.pico-io-input { display: flex; align-items: center; gap: var(--pico-space-2); }
.pico-io-input .pico-input { flex: 1; min-width: 0; }

.pico-error {
  margin-top: var(--pico-space-2);
  padding-top: var(--pico-space-2);
  border-top: var(--pico-line);
  color: var(--pico-accent-deep);
}

.pico-scene {
  position: relative;
  display: grid;
  flex: 1;
  min-height: 0;
  place-items: center;
  overflow: hidden;
}

.pico-trace {
  flex-shrink: 0;
  padding: 10px var(--pico-space-4);
  border-top: var(--pico-line);
  background: var(--pico-paper);
}

.pico-btn {
  min-height: 36px;
  padding: 6px 13px;
  border: var(--pico-line);
  border-radius: var(--pico-radius);
  color: var(--pico-ink);
  background: var(--pico-surface-raised);
  cursor: pointer;
  font: 600 var(--pico-size-sm)/1 var(--pico-font-ui);
  transition: background var(--pico-duration-fast), border-color var(--pico-duration-fast), transform 80ms;
}

.pico-btn:hover { border-color: var(--pico-ink-soft); background: var(--pico-surface); }
.pico-btn:active { transform: translateY(1px); }
.pico-btn--primary { border-color: var(--pico-accent-deep); color: var(--pico-on-accent); background: var(--pico-accent); }
.pico-btn--primary:hover { background: var(--pico-accent-deep); }
.pico-btn--icon { width: 36px; padding: 0; font-size: 17px; }
.pico-btn--quiet { border-color: transparent; background: transparent; }
.pico-btn--quiet:hover { border-color: var(--pico-hairline); background: var(--pico-accent-wash); }
.pico-btn--small {
  min-height: 28px;
  padding: 4px 10px;
  font-size: var(--pico-size-sm);
  border-radius: var(--pico-radius-sm);
}
.pico-btn:disabled { opacity: .42; cursor: default; }

.pico-input {
  padding: var(--pico-space-2) var(--pico-space-3);
  border: var(--pico-line);
  border-radius: var(--pico-radius);
  color: var(--pico-ink);
  background: var(--pico-surface-raised);
  font: var(--pico-size-code)/1.4 var(--pico-font-mono);
}

.pico-input:focus { border-color: var(--pico-accent); }

.pico-slider {
  --pico-progress: 0%;
  width: 100%;
  height: 20px;
  margin: 0;
  appearance: none;
  background: transparent;
  cursor: pointer;
}

.pico-slider::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--pico-accent) var(--pico-progress), var(--pico-hairline) var(--pico-progress));
}

.pico-slider::-webkit-slider-thumb {
  width: 16px;
  height: 16px;
  margin-top: -6px;
  appearance: none;
  border: 3px solid var(--pico-paper);
  border-radius: 50%;
  background: var(--pico-accent);
  box-shadow: 0 0 0 1px var(--pico-accent-deep);
}

.pico-slider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--pico-hairline); }
.pico-slider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--pico-accent); }
.pico-slider::-moz-range-thumb { width: 12px; height: 12px; border: 2px solid var(--pico-paper); border-radius: 50%; background: var(--pico-accent); }
.pico-step { color: var(--pico-ink-soft); font: var(--pico-size-xs)/1 var(--pico-font-mono); white-space: nowrap; }

@media (max-width: 760px) {
  .pico-page { min-height: 100%; height: auto; padding: 12px; }
  .pico-shell { grid-template-columns: 1fr; grid-template-rows: minmax(360px, auto) minmax(480px, auto); }
  .pico-shell--world-only { grid-template-rows: minmax(480px, auto); }
  .pico-code { border-right: 0; border-bottom: var(--pico-line); }
  .pico-step { justify-self: end; }
}

@media (pointer: coarse) {
  .pico-btn,
  .pico-btn--small,
  .pico-btn--icon,
  .pico-function { min-height: 44px; }
  .pico-slider { height: 44px; }
}

@media (prefers-reduced-motion: reduce) {
  .pico-root { scroll-behavior: auto; }
  .pico-btn:active,
  .pico-function:active { transform: none; }
}

/* 教学领域组件 */

/* 1. 扑克卡牌系统 */
.pico-card-row {
  display: grid;
  grid-template-columns: repeat(var(--pico-card-cols, 4), 1fr);
  gap: var(--pico-card-gap, var(--pico-space-3));
}

.pico-card {
  position: relative;
  width: var(--pico-card-width, 100%);
  aspect-ratio: var(--pico-card-ratio, 5 / 7);
  min-height: var(--pico-card-min-h, 120px);
  color: var(--pico-ink);
  background: var(--pico-surface-raised);
  border: var(--pico-line);
  border-radius: var(--pico-radius);
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-sizing: border-box;
  user-select: none;
  font: inherit;
  text-align: left;
  appearance: none;
  -webkit-appearance: none;
  transition: transform var(--pico-duration-fast) var(--pico-ease-out), border-color var(--pico-duration-fast) var(--pico-ease-out);
  cursor: pointer;
}

.pico-card:hover:not(.pico-card--used) {
  transform: translateY(-2px);
  border-color: var(--pico-accent);
}

.pico-card--sm { --pico-card-min-h: 90px; padding: 6px 8px; }
.pico-card--lg { --pico-card-min-h: 150px; padding: 12px 14px; }

.pico-card--selected {
  border: 2px solid var(--pico-accent);
  transform: translateY(-2px);
}

.pico-card--red { color: var(--pico-card-red); }

.pico-card-suit-icon {
  font-family: Georgia, serif;
  font-size: var(--pico-size-sm);
  line-height: 1;
}

.pico-card-suit-icon--center {
  align-self: center;
  font-size: 38px;
  margin: 0 auto;
}

.pico-card--matched {
  border: 2px dashed var(--pico-accent);
  background: var(--pico-accent-wash);
}

.pico-card--used {
  opacity: 0.45;
  background: var(--pico-surface);
  cursor: not-allowed;
}

.pico-card--back {
  color: var(--pico-on-accent);
  background: var(--pico-accent-deep);
  border: 2px solid var(--pico-accent);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px;
}

.pico-card-back-inner {
  width: 100%;
  height: 100%;
  border: 1px solid currentColor;
  border-radius: var(--pico-radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
}

.pico-card-back-emblem {
  font-family: var(--pico-font-mono);
  font-size: 12px;
  font-weight: 800;
  color: currentColor;
  letter-spacing: 0.15em;
}

.pico-card-corner {
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1;
  gap: 2px;
}

.pico-card-corner-bottom {
  align-self: flex-end;
  transform: rotate(180deg);
}

.pico-card-corner-val {
  font-family: var(--pico-font-mono);
  font-size: 13px;
  font-weight: 800;
}

.pico-card-state {
  position: absolute;
  top: var(--pico-space-2);
  right: var(--pico-space-2);
  color: var(--pico-accent-deep);
  font-weight: 800;
}

/* Turtle 运行时输出 presentation attributes；公共 CSS 负责主题覆盖。 */
.pico-turtle-view .pico-canvas-frame rect,
.pico-turtle-view .pico-overlay-grid line { stroke: var(--pico-hairline); }
.pico-turtle-view .pico-overlay-axes line { stroke: var(--pico-ink-soft); }
.pico-turtle-view .pico-overlay-axes text,
.pico-turtle-view .pico-overlay-axes circle { fill: var(--pico-ink-soft); }

/* 2. 华容道与拟物推盘系统 */
.pico-klotski-frame {
  background: #78350f;
  border: 6px solid #451a03;
  border-radius: 14px;
  padding: 10px;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2), inset 0 2px 8px rgba(0, 0, 0, 0.4);
  display: inline-block;
}

.pico-klotski-board-classic {
  width: var(--pico-klotski-w, 240px);
  height: var(--pico-klotski-h, 300px);
  position: relative;
  background: #fef3c7;
  border-radius: 6px;
  box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.15);
}

.pico-klotski-block {
  position: absolute;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 14px;
  color: #ffffff;
  user-select: none;
  cursor: pointer;
  transition: transform var(--pico-duration-fast) ease, box-shadow var(--pico-duration-fast) ease;
  box-sizing: border-box;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
}

.pico-klotski-block:hover {
  transform: scale(1.02);
  filter: brightness(1.06);
}

/* 固定尺寸与 KlotskiBoardView 默认 (240x300, 内距 12) 的计算结果一致：
   1 单位 = 53px 宽 / 54px 高，2 单位 = 110px 宽 / 111px 高；组件会以内联样式覆盖 */
.pico-block--caocao {
  width: 110px;
  height: 111px;
  background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
  border: 2px solid #f87171;
  box-shadow: 0 4px 10px rgba(185, 28, 28, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.3);
  font-size: 18px;
}

.pico-block--horizontal {
  width: 110px;
  height: 54px;
  background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
  border: 2px solid #60a5fa;
  box-shadow: 0 4px 8px rgba(29, 78, 216, 0.3), inset 0 2px 4px rgba(255, 255, 255, 0.3);
}

.pico-block--vertical {
  width: 53px;
  height: 111px;
  background: linear-gradient(135deg, #10b981 0%, #047857 100%);
  border: 2px solid #34d399;
  box-shadow: 0 4px 8px rgba(4, 120, 87, 0.3), inset 0 2px 4px rgba(255, 255, 255, 0.3);
  writing-mode: vertical-lr;
  letter-spacing: 0.2em;
}

.pico-block--pawn {
  width: 53px;
  height: 54px;
  background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
  border: 2px solid #fbbf24;
  box-shadow: 0 3px 6px rgba(180, 83, 9, 0.3), inset 0 2px 4px rgba(255, 255, 255, 0.3);
}

.pico-number-slider-board {
  display: grid;
  grid-template-columns: repeat(var(--pico-slider-cols, 4), var(--pico-slider-size, 56px));
  grid-template-rows: repeat(var(--pico-slider-rows, 4), var(--pico-slider-size, 56px));
  gap: 8px;
  background: #1e293b;
  border: 6px solid #0f172a;
  border-radius: 14px;
  padding: 10px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15), inset 0 2px 8px rgba(0, 0, 0, 0.4);
}

.pico-slider-tile {
  background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
  border-radius: 8px;
  border: 1px solid #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--pico-font-mono);
  font-size: 20px;
  font-weight: 800;
  color: #0f172a;
  box-shadow: 0 4px 0 #94a3b8, 0 6px 10px rgba(0, 0, 0, 0.15);
  cursor: pointer;
  user-select: none;
  transition: transform var(--pico-duration-fast) ease, box-shadow var(--pico-duration-fast) ease;
}

.pico-slider-tile:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #94a3b8, 0 8px 14px rgba(0, 0, 0, 0.2);
}

.pico-slider-tile:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #94a3b8, 0 3px 6px rgba(0, 0, 0, 0.15);
}

.pico-slider-tile--empty {
  background: rgba(255, 255, 255, 0.05);
  border: 1.5px dashed rgba(255, 255, 255, 0.2);
  box-shadow: none;
  cursor: default;
}

/* 3. 五子棋与围棋系统 */
.pico-gobang-board {
  position: relative;
  width: var(--pico-gobang-size, 420px);
  height: var(--pico-gobang-size, 420px);
  background: radial-gradient(circle at 45% 45%, #fbe8c9 0%, #e6c594 65%, #cca56f 100%);
  border: 5px solid #7c4a1e;
  border-radius: 12px;
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.15), inset 0 1px 4px rgba(255, 255, 255, 0.6);
  padding: 16px;
  box-sizing: border-box;
}

.pico-stone {
  position: absolute;
  width: var(--pico-stone-size, 22px);
  height: var(--pico-stone-size, 22px);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  cursor: pointer;
  transition: transform var(--pico-duration-fast) ease, box-shadow var(--pico-duration-fast) ease;
}

.pico-stone:hover {
  transform: translate(-50%, -50%) scale(1.08);
}

.pico-stone--black {
  background: radial-gradient(circle at 35% 30%, #64748b 0%, #1e293b 45%, #020617 100%);
  box-shadow: 0 3px 6px rgba(0, 0, 0, 0.45), inset 0 1px 2px rgba(255, 255, 255, 0.25);
}

.pico-stone--white {
  background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f8fafc 55%, #cbd5e1 100%);
  border: 0.5px solid rgba(0, 0, 0, 0.12);
  box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.95);
}

.pico-stone--last::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #ef4444;
  box-shadow: 0 0 8px #ef4444;
}

/* 悬浮落子预览虚影 */
.pico-stone--ghost {
  opacity: 0.45;
  pointer-events: none;
}

/* 键盘落子光标 */
.pico-stone-cursor {
  position: absolute;
  width: 27px;
  height: 27px;
  border: 2px dashed rgba(109, 74, 255, 0.85);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.pico-gobang-board:focus-visible {
  outline: 2px solid var(--pico-accent, #6d4aff);
  outline-offset: 3px;
}

/* 胜利连线与端点 */
.pico-gobang-win-line {
  stroke: #ef4444;
  stroke-width: 5;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  opacity: 0.9;
}

.pico-gobang-win-cap {
  fill: #ef4444;
  opacity: 0.9;
}

/* 4. 数独网格系统 */
.pico-sudoku-board {
  display: grid;
  grid-template-columns: repeat(9, var(--pico-sudoku-cell, 36px));
  grid-template-rows: repeat(9, var(--pico-sudoku-cell, 36px));
  border: 3px solid #0f172a;
  border-radius: 8px;
  overflow: hidden;
  background: #ffffff;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  width: fit-content;
}

.pico-sudoku-cell {
  border: 0.5px solid #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--pico-font-mono);
  font-size: 17px;
  font-weight: 600;
  color: #0f172a;
  cursor: pointer;
  user-select: none;
  transition: background var(--pico-duration-fast) ease;
}

.pico-sudoku-cell:not(.pico-sudoku-cell--active):not(.pico-sudoku-cell--error):hover {
  background: #eef2ff;
}

.pico-sudoku-cell:nth-child(3n) { border-right: 2.5px solid #0f172a; }
.pico-sudoku-cell:nth-child(9n) { border-right: none; }
.pico-sudoku-cell:nth-child(n+19):nth-child(-n+27),
.pico-sudoku-cell:nth-child(n+46):nth-child(-n+54) {
  border-bottom: 2.5px solid #0f172a;
}

.pico-sudoku-cell--fixed {
  font-weight: 800;
  background: #f8fafc;
  color: #0f172a;
}

.pico-sudoku-cell--user {
  color: #2563eb;
  font-weight: 700;
}

.pico-sudoku-cell--crosshair {
  background: #f1f5f9;
}

.pico-sudoku-cell--active {
  background: #dbeafe !important;
  box-shadow: inset 0 0 0 2px #2563eb;
}

.pico-sudoku-cell--error {
  background: #fee2e2 !important;
  color: #b91c1c;
}

.pico-sudoku-board:focus-visible {
  outline: 2px solid #2563eb;
  outline-offset: 3px;
}

/* 4.1 数独数字键盘 */
.pico-sudoku-numpad {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  align-items: center;
  flex-wrap: wrap;
}

.pico-sudoku-num-btn {
  width: 40px;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  border: 1.5px solid #cbd5e1;
  background: #ffffff;
  color: #0f172a;
  font-family: var(--pico-font-mono);
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
  transition: all var(--pico-duration-fast) ease;
}

.pico-sudoku-num-btn:hover {
  background: #eff6ff;
  border-color: #2563eb;
  color: #2563eb;
  transform: translateY(-1px);
}

.pico-sudoku-num-btn:active {
  transform: translateY(0);
}

.pico-sudoku-num-btn--erase {
  width: auto;
  padding: 0 12px;
  font-size: 13px;
  color: #64748b;
}

/* 降低动态效果 */
@media (prefers-reduced-motion: reduce) {
  .pico-card,
  .pico-klotski-block,
  .pico-slider-tile,
  .pico-stone {
    transition: none;
    transform: none !important;
  }

  .pico-card:hover:not(.pico-card--used),
  .pico-slider-tile:hover {
    transform: none !important;
  }

  .pico-slider-tile:active {
    transform: none !important;
    box-shadow: 0 4px 0 #94a3b8, 0 6px 10px rgba(0, 0, 0, 0.15);
  }

  .pico-klotski-block:hover {
    transform: none;
  }
}
</style>

def _traceable(filename):

def _depth(frame):
    d = 0
    f = frame.f_back
    while f is not None:
        if _traceable(f.f_code.co_filename):
            d += 1
        f = f.f_back
    return d


def _safe(v):
    # locals \u7684 JSON \u5B89\u5168\u5316\uFF1A\u5BB9\u5668\u9012\u5F52\uFF0C\u5176\u4F59\u5BF9\u8C61\u9000\u5316\u4E3A repr \u5B57\u7B26\u4E32
    if v is None or isinstance(v, (bool, int, str)):
        return v
    if isinstance(v, float):
        return repr(v) if v != v or v in (float("inf"), float("-inf")) else v
    if isinstance(v, (list, tuple)):
        return [_safe(x) for x in v]
    if isinstance(v, deque):
        return [_safe(x) for x in v]
    if isinstance(v, (set, frozenset)):
        return sorted((_safe(x) for x in v), key=repr)
    if isinstance(v, dict):
        return {str(k): _safe(x) for k, x in v.items()}
    return repr(v)


def _frame_locals(frame):
    loc = {}
    for k, v in frame.f_locals.items():
        if (k.startswith("_bridge_")
                or k in ("_source", "_entry", "_inject")
                or (frame.f_code.co_name == "<module>" and k in _PICO_HIDDEN_NAMES)):
            continue

def _trace(frame, event, arg):
    if not _traceable(frame.f_code.co_filename):
        return None
    if event == "line":
        _step()
        _bridge_stmt(frame.f_lineno, _depth(frame), frame.f_code.co_name, _frame_locals(frame))
    elif event == "call":
        _step()
        _bridge_call(frame.f_lineno, _depth(frame), frame.f_code.co_name, _frame_locals(frame))
    elif event == "return":
        opcode = _dis.opname[frame.f_code.co_code[frame.f_lasti]]
        if arg is not None or opcode.startswith("RETURN_"):
            _step()
            _bridge_return(frame.f_lineno, _depth(frame), frame.f_code.co_name, json.dumps(_safe(arg)))

_control_stack = []


class _TraceBlock:
    def __init__(self, kind, block_id, label, line):
        self.kind = kind
        self.id = block_id
        self.label = label
        self.line = line
        self.iteration = None
        self.count = 0

    def __enter__(self):
        if self.kind == "iteration":
            loop = next(block for block in reversed(_control_stack)
                        if block.kind == "loop" and block.id == self.id)
            loop.count += 1
            self.iteration = loop.count
            self.label = "\u7B2C " + str(self.iteration) + " \u6B21"
        _control_stack.append(self)
        _step()
        frame = sys._getframe(1)
        _bridge_control("enter", self.kind, self.id, self.label, self.line, self.iteration,
                        _depth(frame), frame.f_code.co_name, _frame_locals(frame))

    def __exit__(self, exc_type, exc, tb):
        _control_stack.pop()
        if exc_type is not _PicoInputPending:
            _step()
            frame = sys._getframe(1)
            _bridge_control("exit", self.kind, self.id, self.label, self.line, self.iteration,
                            _depth(frame), frame.f_code.co_name, _frame_locals(frame))


def _trace_block(kind, block_id, label, line):
    return _TraceBlock(kind, block_id, label, line)


class _ControlTransformer(_ast.NodeTransformer):
    def _block(self, body, kind, block_id, label, line, owner):
        call = _ast.Call(
            func=_ast.Name(id="_trace_block", ctx=_ast.Load()),
            args=[_ast.Constant(kind), _ast.Constant(block_id), _ast.Constant(label), _ast.Constant(line)],
            keywords=[],

        return _ast.copy_location(block, owner)

    def visit_For(self, node):
        self.generic_visit(node)
        block_id = "loop:" + str(node.lineno) + ":" + str(node.col_offset)
        node.body = [self._block(node.body, "iteration", block_id, "", node.lineno, node)]
        label = "for " + _ast.unparse(node.target) + " in " + _ast.unparse(node.iter)
        return self._block([node], "loop", block_id, label, node.lineno, node)

    def visit_While(self, node):
        self.generic_visit(node)
        block_id = "loop:" + str(node.lineno) + ":" + str(node.col_offset)
        node.body = [self._block(node.body, "iteration", block_id, "", node.lineno, node)]
        label = "while " + _ast.unparse(node.test)
        return self._block([node], "loop", block_id, label, node.lineno, node)

    def visit_If(self, node):
        if len(node.orelse) == 1 and isinstance(node.orelse[0], _ast.If):
            node.orelse[0]._pico_elif = True

        block_id = "branch:" + str(node.lineno) + ":" + str(node.col_offset)
        label = ("elif " if getattr(node, "_pico_elif", False) else "if ") + _ast.unparse(node.test)
        node.body = [self._block(node.body, "branch", block_id + ":if", label, node.lineno, node)]
        if node.orelse and not (len(node.orelse) == 1 and isinstance(node.orelse[0], _ast.If)):
            node.orelse = [self._block(node.orelse, "branch", block_id + ":else", "else", node.lineno, node)]

import ast
import json
import re
from collections import Counter

def _pico_analyze_24(source_text, target_numbers_json):
    target_numbers = json.loads(target_numbers_json)
    cleaned = source_text.strip()

    # 1. \u68C0\u67E5\u662F\u5426\u4E3A\u7A7A\u6216\u53EA\u6709 result =
    if not cleaned or re.match(r"^(\\s*#.*\\n)*\\s*result\\s*=\\s*$", cleaned):
        _report_twenty_four(json.dumps({
            "status": "waiting",
            "message": "\u8BF7\u5728 result = \u540E\u8F93\u5165\u7B97\u672F\u8868\u8FBE\u5F0F",
            "result": None,
            "usedNumbers": [],
            "tree": None,
            "allCardsUsed": False,
            "is24": False
        }))
        return

    # 2. \u5C1D\u8BD5 AST \u8BED\u6CD5\u89E3\u6790
    try:
        mod = ast.parse(source_text)
    except SyntaxError:
        _report_twenty_four(json.dumps({
            "status": "syntax_incomplete",
            "message": "\u8868\u8FBE\u5F0F\u6B63\u5728\u8F93\u5165\u4E2D...",
            "result": None,
            "usedNumbers": [],
            "tree": None,
            "allCardsUsed": False,
            "is24": False
        }))
        return

    # 3. \u63D0\u53D6\u8868\u8FBE\u5F0F\u8282\u70B9
    expr_node = None
    for stmt in mod.body:
        if isinstance(stmt, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "result" for t in stmt.targets):
            expr_node = stmt.value
            break
        elif isinstance(stmt, ast.Expr) and not isinstance(stmt.value, ast.Call):
            expr_node = stmt.value
            break

    if expr_node is None:
        _report_twenty_four(json.dumps({
            "status": "waiting",
            "message": "\u8BF7\u4E3A result \u8D4B\u503C\u7B97\u672F\u8868\u8FBE\u5F0F",
            "result": None,
            "usedNumbers": [],
            "tree": None,
            "allCardsUsed": False,
            "is24": False
        }))
        return

    # 4. \u6784\u5EFA\u4E8C\u53C9\u8BA1\u7B97\u6811\u4E0E\u63D0\u53D6\u6570\u5B57
    used_numbers = []

    def _build_tree(node):
        if isinstance(node, ast.Constant):
            val = node.value
            if isinstance(val, (int, float)):
                used_numbers.append(val)
                return {"kind": "num", "value": val}
        elif hasattr(ast, "Num") and isinstance(node, getattr(ast, "Num")):
            val = getattr(node, "n", None)
            if isinstance(val, (int, float)):
                used_numbers.append(val)
                return {"kind": "num", "value": val}
        elif isinstance(node, ast.BinOp):
            op_map = {
                ast.Add: "+", ast.Sub: "-", ast.Mult: "*", ast.Div: "/", ast.FloorDiv: "//"
            }
            op_char = op_map.get(type(node.op), None)
            if op_char is None:
                raise ValueError("\u4EC5\u652F\u6301 + - * / \u7B97\u672F\u8FD0\u7B97\u7B26")
            left = _build_tree(node.left)
            right = _build_tree(node.right)
            sub_code = compile(ast.Expression(node), "<string>", "eval")
            val = eval(sub_code)
            return {"kind": "op", "op": op_char, "value": val, "left": left, "right": right}
        elif isinstance(node, ast.UnaryOp) and isinstance(node.op, ast.USub):
            sub = _build_tree(node.operand)
            val = -sub["value"]
            return {"kind": "num", "value": val}
        raise ValueError(f"\u4E0D\u652F\u6301\u7684\u8BED\u6CD5\u8282\u70B9\uFF1A{type(node).__name__}")

    try:
        tree = _build_tree(expr_node)
        final_val = eval(compile(ast.Expression(expr_node), "<string>", "eval"))
    except Exception as e:
        _report_twenty_four(json.dumps({
            "status": "eval_error",
            "message": f"\u8BA1\u7B97\u51FA\u9519\uFF1A{str(e)}",
            "result": None,
            "usedNumbers": used_numbers,
            "tree": None,
            "allCardsUsed": False,
            "is24": False
        }))
        return

    # 5. \u6821\u9A8C\u5361\u724C\u5339\u914D (\u591A\u91CD\u96C6\u7CBE\u786E\u6BD4\u5BF9)
    target_counts = Counter(target_numbers)
    used_counts = Counter(used_numbers)
    all_cards_used = (used_counts == target_counts)
    is_24 = isinstance(final_val, (int, float)) and abs(final_val - 24) < 1e-5

    _report_twenty_four(json.dumps({
        "status": "success" if (is_24 and all_cards_used) else "calculating",
        "result": final_val,
        "usedNumbers": used_numbers,
        "tree": tree,
        "allCardsUsed": all_cards_used,
        "is24": is_24
    }))
