<style>/* ============================================================

@font-face {

@font-face { font-family: "Pico WenKai 112"; src: url("./fonts/lxgwwenkaiscreen-subset-112.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 113"; src: url("./fonts/lxgwwenkaiscreen-subset-113.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 114"; src: url("./fonts/lxgwwenkaiscreen-subset-114.woff2") format("woff2"); font-display: swap; }

@font-face { font-family: "Pico WenKai 119"; src: url("./fonts/lxgwwenkaiscreen-subset-119.woff2") format("woff2"); font-display: swap; }

:root {
  color-scheme: light dark;
  --pico-paper: #fbfbfa;
  --pico-surface: #f3f3f1;
  --pico-surface-raised: #ffffff;
  --pico-ink: #202022;
  --pico-ink-soft: #66666d;
  --pico-hairline: #d9d9d5;
  --pico-accent: #6d4aff;
  --pico-accent-deep: #5535da;
  --pico-accent-wash: #eeeaff;
  --pico-on-accent: #ffffff;
  --pico-code-bg: #f7f7f5;
  --pico-code-ink: var(--pico-ink);
  --pico-code-dim: #a0a09d;
  --pico-syn-key: #6d4aff;
  --pico-syn-fn: #4f46a5;
  --pico-syn-str: #287058;
  --pico-syn-num: #9a5b13;
  --pico-syn-com: #74747a;
  --pico-font-text: "Pico WenKai 103", "Pico WenKai 105", "Pico WenKai 108",
    "Pico WenKai 111", "Pico WenKai 112",
    "Pico WenKai 113", "Pico WenKai 114", "Pico WenKai 115",
    "Pico WenKai 116", "Pico WenKai 117", "Pico WenKai 118",
    "Pico WenKai 119", "LXGW WenKai Screen", "LXGW WenKai", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --pico-font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --pico-font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo,
    Consolas, "LXGW WenKai Screen", "LXGW WenKai", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", monospace;
  --pico-size-xs: 13px;
  --pico-size-sm: 15px;
  --pico-size-code: 16px;
  --pico-size-md: 18px;
  --pico-size-lg: 22px;
  --pico-size-xl: 30px;
  --pico-space-1: 4px;
  --pico-space-2: 8px;
  --pico-space-3: 12px;
  --pico-space-4: 16px;
  --pico-space-5: 24px;
  --pico-space-6: 40px;
  --pico-radius-sm: 3px;
  --pico-radius: 6px;
  --pico-line: 1px solid var(--pico-hairline);
  --pico-shadow: 0 1px 3px rgba(32, 32, 34, .08);
  --pico-ease-out: cubic-bezier(.2, .8, .2, 1);
  --pico-duration-fast: 140ms;
  --pico-duration-move: 360ms;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-pico-theme="light"]) {
    --pico-paper: #151516;
    --pico-surface: #1d1d20;
    --pico-surface-raised: #242428;
    --pico-ink: #f1f0ee;
    --pico-ink-soft: #b5b3b8;
    --pico-hairline: #46464c;
    --pico-accent: #a78bfa;
    --pico-accent-deep: #c4b5fd;
    --pico-accent-wash: rgba(167, 139, 250, .16);
    --pico-on-accent: #22133d;
    --pico-code-bg: #111113;
    --pico-code-dim: #7e7e86;
    --pico-syn-key: #d2a8ff;
    --pico-syn-fn: #b9a1ff;
    --pico-syn-str: #8ddbaf;
    --pico-syn-num: #e6b86b;
    --pico-syn-com: #92929a;
    --pico-shadow: 0 1px 3px rgba(0, 0, 0, .3);
  }
}

:root[data-pico-theme="dark"] {
  --pico-paper: #151516;
  --pico-surface: #1d1d20;
  --pico-surface-raised: #242428;
  --pico-ink: #f1f0ee;
  --pico-ink-soft: #b5b3b8;
  --pico-hairline: #46464c;
  --pico-accent: #a78bfa;
  --pico-accent-deep: #c4b5fd;
  --pico-accent-wash: rgba(167, 139, 250, .16);
  --pico-on-accent: #22133d;
  --pico-code-bg: #111113;
  --pico-code-dim: #7e7e86;
  --pico-syn-key: #d2a8ff;
  --pico-syn-fn: #b9a1ff;
  --pico-syn-str: #8ddbaf;
  --pico-syn-num: #e6b86b;
  --pico-syn-com: #92929a;
  --pico-shadow: 0 1px 3px rgba(0, 0, 0, .3);
}

* { box-sizing: border-box; }

.pico-root {
  margin: 0;
  color: var(--pico-ink);
  background: var(--pico-paper);
  font: var(--pico-size-md)/1.65 var(--pico-font-text);
}

.pico-root ::selection { background: var(--pico-accent-wash); }
.pico-root button,
.pico-root input { font: inherit; }

.pico-root button:focus-visible,
.pico-root input:focus-visible {
  outline: 2px solid var(--pico-accent);
  outline-offset: 3px;
}

/* 公共讲义骨架 */
.pico-shell {
  display: grid;
  grid-template-columns: 43fr 57fr;
  grid-template-rows: minmax(0, 1fr) 86px;
  overflow: hidden;
  border: var(--pico-line);
  border-radius: var(--pico-radius);
  background: var(--pico-surface-raised);
}

.pico-code,
.pico-world {
  display: flex;
  min-width: 0;
  min-height: 0;
  flex-direction: column;
}

.pico-code {
  border-right: var(--pico-line);
  background: var(--pico-code-bg);
}

.pico-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 44px;
  padding: 0 var(--pico-space-4);
  background: var(--pico-paper);
}

.pico-panel-title {
  margin: 0;
  color: var(--pico-ink-soft);
  font: 600 var(--pico-size-lg)/1 var(--pico-font-text);
}

.pico-panel-title--world {
  color: var(--pico-ink);
}

/* 编辑器外观。CodeMirror 主题应映射到同一批 token。 */
.pico-editor {
  flex: 1;
  margin: 0;
  overflow: auto;
  padding: 18px 0;
  color: var(--pico-ink);
  background: var(--pico-code-bg);
  font: var(--pico-size-code)/1.8 var(--pico-font-mono);
  tab-size: 4;
}

.pico-line {
  display: block;
  min-height: 1.8em;
  padding-right: 18px;
  border-left: 3px solid transparent;
  white-space: pre;
}

.pico-current-line {
  border-left-color: var(--pico-accent);
  background: var(--pico-accent-wash);
}

.pico-ln {
  display: inline-block;
  width: 3.4em;
  padding-right: var(--pico-space-4);
  color: var(--pico-code-dim);
  text-align: right;
  user-select: none;
}

.pico-kw { color: var(--pico-syn-key); font-weight: 600; }
.pico-fn { color: var(--pico-syn-fn); }
.pico-str { color: var(--pico-syn-str); }
.pico-num { color: var(--pico-syn-num); }
.pico-com { color: var(--pico-syn-com); font-style: italic; }

.pico-functions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: var(--pico-space-3) var(--pico-space-4);
  border-top: var(--pico-line);
  background: var(--pico-surface);
}

.pico-world-note {
  padding: var(--pico-space-4);
  color: var(--pico-ink-soft);
  font-size: var(--pico-size-sm);
}

.pico-function {
  min-height: 28px;
  padding: 4px 8px;
  border: 1px solid transparent;
  border-radius: var(--pico-radius-sm);
  color: color-mix(in srgb, var(--pico-accent-deep) 52%, var(--pico-ink-soft));
  background: color-mix(in srgb, var(--pico-accent-wash) 52%, var(--pico-surface));
  cursor: pointer;
  font: 500 var(--pico-size-xs)/1.2 var(--pico-font-mono);
  transition: border-color var(--pico-duration-fast), background var(--pico-duration-fast), transform 80ms;
}

.pico-function:hover { border-color: color-mix(in srgb, var(--pico-accent) 28%, var(--pico-hairline)); background: color-mix(in srgb, var(--pico-accent-wash) 72%, var(--pico-surface)); }
.pico-function:active { transform: translateY(1px); }

/* input/output、错误与预览也是跨课程公共能力。 */
.pico-io {
  padding: var(--pico-space-3) var(--pico-space-4);
  border-top: var(--pico-line);
  background: var(--pico-paper);
  font: var(--pico-size-md)/1.6 var(--pico-font-text);
}

.pico-error {
  margin-top: var(--pico-space-2);
  padding-top: var(--pico-space-2);
  border-top: var(--pico-line);
  color: var(--pico-accent-deep);
}

.pico-preview { opacity: .48; outline: 1.5px dashed var(--pico-accent); outline-offset: 3px; }
.pico-preview-label { color: var(--pico-accent-deep); font: var(--pico-size-xs)/1 var(--pico-font-ui); }

.pico-scene {
  position: relative;
  display: grid;
  flex: 1;
  min-height: 0;
  place-items: center;
  overflow: hidden;
}

/* 运行与回放 */
.pico-runbar {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: auto auto minmax(180px, 1fr) auto;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
  border-top: var(--pico-line);
  background: var(--pico-paper);
}

.pico-controls { display: flex; gap: 6px; }

.pico-btn {
  min-height: 36px;
  padding: 6px 13px;
  border: var(--pico-line);
  border-radius: var(--pico-radius);
  color: var(--pico-ink);
  background: var(--pico-surface-raised);
  cursor: pointer;
  font: 600 var(--pico-size-sm)/1 var(--pico-font-ui);
  transition: background var(--pico-duration-fast), border-color var(--pico-duration-fast), transform 80ms;
}

.pico-btn:hover { border-color: var(--pico-ink-soft); background: var(--pico-surface); }
.pico-btn:active { transform: translateY(1px); }
.pico-btn--primary { border-color: var(--pico-accent-deep); color: var(--pico-on-accent); background: var(--pico-accent); }
.pico-btn--primary:hover { background: var(--pico-accent-deep); }
.pico-btn--icon { width: 36px; padding: 0; font-size: 17px; }
.pico-btn--quiet { border-color: transparent; background: transparent; }
.pico-btn--quiet:hover { border-color: var(--pico-hairline); background: var(--pico-accent-wash); }
.pico-btn:disabled { opacity: .42; cursor: default; }

.pico-input {
  padding: var(--pico-space-2) var(--pico-space-3);
  border: var(--pico-line);
  border-radius: var(--pico-radius);
  color: var(--pico-ink);
  background: var(--pico-surface-raised);
  font: var(--pico-size-code)/1.4 var(--pico-font-mono);
}

.pico-input:focus { border-color: var(--pico-accent); }

.pico-select {
  min-height: 34px;
  padding: 6px 34px 6px 11px;
  appearance: none;
  border: var(--pico-line);
  border-radius: var(--pico-radius);
  color: var(--pico-ink);
  background-color: var(--pico-surface-raised);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--pico-ink-soft) 50%),
    linear-gradient(135deg, var(--pico-ink-soft) 50%, transparent 50%);
  background-position:
    calc(100% - 16px) calc(50% - 2px),
    calc(100% - 11px) calc(50% - 2px);
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  cursor: pointer;
  font: 500 var(--pico-size-sm)/1.2 var(--pico-font-ui);
  transition: border-color var(--pico-duration-fast), background-color var(--pico-duration-fast);
}

.pico-select:hover { border-color: color-mix(in srgb, var(--pico-ink-soft) 58%, var(--pico-hairline)); }
.pico-select:focus { border-color: var(--pico-accent); outline: 2px solid var(--pico-accent-wash); outline-offset: 2px; }
.pico-select:disabled { opacity: .48; cursor: default; }
.pico-select option { color: var(--pico-ink); background: var(--pico-surface-raised); }
.pico-timeline { display: grid; gap: 9px; }
.pico-timeline-meta { display: flex; justify-content: space-between; color: var(--pico-ink-soft); font: 12px/1 var(--pico-font-ui); }

.pico-slider {
  --pico-progress: 0%;
  width: 100%;
  height: 20px;
  margin: 0;
  appearance: none;
  background: transparent;
  cursor: pointer;
}

.pico-slider::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--pico-accent) var(--pico-progress), var(--pico-hairline) var(--pico-progress));
}

.pico-slider::-webkit-slider-thumb {
  width: 16px;
  height: 16px;
  margin-top: -6px;
  appearance: none;
  border: 3px solid var(--pico-paper);
  border-radius: 50%;
  background: var(--pico-accent);
  box-shadow: 0 0 0 1px var(--pico-accent-deep);
}

.pico-slider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--pico-hairline); }
.pico-slider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--pico-accent); }
.pico-slider::-moz-range-thumb { width: 12px; height: 12px; border: 2px solid var(--pico-paper); border-radius: 50%; background: var(--pico-accent); }
.pico-step { color: var(--pico-ink-soft); font: var(--pico-size-xs)/1 var(--pico-font-mono); white-space: nowrap; }

/* 公共动效语义。课程只组合，不另起一套时长和缓动。 */
.pico-enter { animation: pico-enter var(--pico-duration-move) var(--pico-ease-out) both; }
.pico-exit { animation: pico-exit var(--pico-duration-fast) ease both; }
.pico-move { transition: transform var(--pico-duration-move) var(--pico-ease-out); }
.pico-scale { transition: transform var(--pico-duration-fast) var(--pico-ease-out); }
.pico-scale[aria-current="true"] { transform: scale(1.05); }

@keyframes pico-enter { from { opacity: 0; transform: translateY(8px); } }
@keyframes pico-exit { to { opacity: 0; transform: translateY(-5px); } }

/* 展示页专用，不属于公共 VI。 */
.vi-page { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 30px 0 72px; }
.vi-header { display: flex; align-items: end; justify-content: space-between; gap: 24px; padding-bottom: 18px; border-bottom: var(--pico-line); }
.vi-header h1 { margin: 0; font-size: 26px; line-height: 1.25; }
.vi-header p { max-width: 42ch; margin: 0; color: var(--pico-ink-soft); font-size: var(--pico-size-sm); }
.vi-kicker, .vi-section > h2 { margin: 0; color: var(--pico-ink-soft); font: 650 var(--pico-size-xs)/1 var(--pico-font-ui); letter-spacing: .06em; }
.vi-kicker { margin-bottom: 5px; color: var(--pico-accent-deep); }
.vi-section { margin-top: 44px; }
.vi-section > h2 { margin-bottom: 16px; }
.vi-demo-shell { height: 570px; }
.vi-output { display: grid; gap: 9px; color: var(--pico-ink-soft); font: var(--pico-size-code)/1.5 var(--pico-font-mono); }
.vi-output span { opacity: .5; }
.vi-output span[aria-current="true"] { color: var(--pico-accent-deep); opacity: 1; }
.vi-samples { display: grid; gap: 34px; }
.vi-sample { padding-top: 14px; border-top: var(--pico-line); }
.vi-sample h3 { margin: 0 0 16px; color: var(--pico-ink-soft); font: 650 var(--pico-size-xs)/1 var(--pico-font-ui); }
.vi-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--pico-space-3); }
.vi-swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--pico-space-3); }
.vi-swatch { display: grid; gap: 6px; color: var(--pico-ink-soft); font: 11px/1.2 var(--pico-font-mono); }
.vi-swatch::before { content: ""; height: 52px; border: var(--pico-line); border-radius: var(--pico-radius-sm); background: var(--swatch); }
.vi-type-text { margin: 0; font-size: var(--pico-size-lg); }
.vi-type-code { margin: 0; font: var(--pico-size-code)/1.6 var(--pico-font-mono); }
.vi-io-demo { width: min(100%, 620px); border: var(--pico-line); border-radius: var(--pico-radius); overflow: hidden; }
.vi-preview-shape { width: 82px; height: 28px; border-radius: var(--pico-radius); background: var(--pico-ink-soft); }
.vi-motion { width: 64px; height: 32px; border: var(--pico-line); border-radius: var(--pico-radius); background: var(--pico-surface); animation: vi-motion 1.8s var(--pico-ease-out) infinite; }
@keyframes vi-motion { 0%, 20% { opacity: 0; transform: translateY(8px) scale(.96); } 45%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-5px); } }

@media (max-width: 760px) {
  .vi-page { width: min(100% - 24px, 680px); }
  .vi-header { align-items: start; flex-direction: column; }
  .pico-shell { grid-template-columns: 1fr; grid-template-rows: 360px 360px auto; }
  .pico-code { border-right: 0; border-bottom: var(--pico-line); }
  .pico-runbar { grid-column: 1; grid-template-columns: 1fr auto; padding: 14px; }
  .pico-timeline { grid-column: 1 / -1; grid-row: 2; }
  .pico-step { justify-self: end; }
  .vi-demo-shell { height: auto; }
  .vi-swatches { grid-template-columns: repeat(3, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

.pico-world-route-shell { display:grid; grid-template-columns:40fr 60fr; width:100%; height:100vh; height:100dvh; min-height:0; overflow:hidden; background:var(--pico-paper); }
.pico-world-route-code,.pico-world-route-world { display:flex; min-width:0; min-height:0; flex-direction:column; }
.pico-world-route-code { border-right:var(--pico-line); background:var(--pico-code-bg); }
.pico-world-route-head { display:flex; min-height:48px; align-items:center; padding:0 16px; border-bottom:var(--pico-line); background:var(--pico-paper); }
.pico-world-route-title { margin:0; color:var(--pico-ink); font:700 var(--pico-size-lg)/1 var(--pico-font-text); }
.pico-world-route-editor { display:flex; flex:1; min-width:0; min-height:0; overflow:hidden; flex-direction:column; }
.pico-world-route-editor .pico-w-editor-host { flex:1 1 auto; width:100%; height:0; min-width:0; min-height:0; }
.pico-world-route-editor .cm-editor { width:100%; height:100%; min-width:0; min-height:0; }
.pico-world-route-editor .cm-scroller { min-width:0; min-height:0; scrollbar-gutter:stable; }
.pico-world-route-inputs { display:grid; gap:12px; padding:12px 16px 16px; border-top:var(--pico-line); background:var(--pico-paper); }
.pico-world-route-preset { display:flex; align-items:center; gap:10px; }
.pico-world-route-preset label { color:var(--pico-ink-soft); font-size:var(--pico-size-sm); }
.pico-world-route-fields { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
.pico-world-route-field { display:grid; gap:4px; min-width:0; color:var(--pico-ink-soft); font-size:var(--pico-size-xs); }
.pico-world-route-field > input,.pico-world-route-field > select { min-width:0; }
.pico-world-route-field input,.pico-world-route-field select { width:100%; min-height:36px; }
.pico-world-route-check { display:flex; align-items:center; gap:8px; min-height:36px; color:var(--pico-ink); }
.pico-world-route-check input { width:auto; min-width:0; }
.pico-world-route-scene { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:16px; }
.pico-world-route-trace { display:flex; min-height:86px; align-items:center; gap:12px; padding:0 18px; border-top:var(--pico-line); background:var(--pico-paper); }
.pico-world-route-play { min-width:64px; }
.route-timeline { display:flex; flex-direction:column; gap:14px; width:100%; max-width:880px; margin:0 auto; }
.route-block { display:flex; flex-direction:column; gap:8px; min-width:0; }
.route-section-title { margin:0; color:var(--pico-ink); font:700 var(--pico-size-md)/1.2 var(--pico-font-text); }
.route-packet-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:8px; }
.route-chip { display:flex; flex-direction:column; gap:2px; padding:7px 9px; border:1px solid var(--pico-hairline); border-radius:var(--pico-radius-sm); background:var(--pico-surface); min-width:0; }
.route-chip--active { border-color:var(--pico-accent); background:var(--pico-accent-wash); }
.route-chip-key { color:var(--pico-ink-soft); font-size:11px; }
.route-chip-value { color:var(--pico-ink); font-family:var(--pico-font-mono); font-size:13px; overflow-wrap:anywhere; }
.route-cards { display:flex; flex-direction:column; gap:12px; }
.route-empty { color:var(--pico-ink-soft); font-size:var(--pico-size-sm); margin:4px 0; }
.route-card { display:flex; flex-direction:column; gap:8px; border:1px solid var(--pico-hairline); border-radius:var(--pico-radius); background:var(--pico-surface-raised); cursor:pointer; text-align:left; min-width:0; }
.route-card:focus-visible { outline:2px solid var(--pico-accent); outline-offset:2px; }
.route-card--current { padding:18px 20px; border:2px solid var(--pico-accent); box-shadow:var(--pico-shadow); }
.route-card--history { padding:10px 12px; }
.route-card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.route-card-meta { color:var(--pico-ink-soft); font-family:var(--pico-font-mono); font-size:12px; }
.route-card--history .route-card-meta { font-size:11px; }
.route-card-badge { padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700; border:1px solid var(--pico-hairline); white-space:nowrap; }
.route-card-badge--true { color:var(--pico-accent-deep); border-color:var(--pico-accent); background:var(--pico-accent-wash); }
.route-card-badge--false { color:var(--pico-ink-soft); }
.route-card-badge--pending { color:var(--pico-ink-soft); border-style:dashed; }
.route-card-cond { color:var(--pico-ink); font-family:var(--pico-font-mono); font-size:14px; line-height:1.7; overflow-wrap:anywhere; word-break:break-word; min-width:0; }
.route-card--history .route-card-cond { font-size:12px; line-height:1.6; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.route-leaves { display:flex; flex-direction:column; gap:5px; min-width:0; }
.route-leaf { display:flex; align-items:baseline; gap:7px; flex-wrap:wrap; min-width:0; padding:5px 9px; border-radius:var(--pico-radius-sm); background:var(--pico-surface); }
.route-card--history .route-leaf { padding:3px 7px; gap:5px; }
.route-leaf-op { color:var(--pico-ink-soft); font-size:11px; font-weight:700; letter-spacing:.5px; flex:0 0 auto; }
.route-leaf-text { font-family:var(--pico-font-mono); font-size:13px; min-width:0; flex:1 1 180px; overflow-wrap:anywhere; color:var(--pico-ink); }
.route-card--history .route-leaf-text { font-size:11px; }
.route-leaf-mark { font-weight:700; width:16px; text-align:center; flex:0 0 auto; }
.route-leaf-mark--true { color:var(--pico-accent-deep); }
.route-leaf-mark--false,.route-leaf-mark--skip,.route-leaf-mark--pending { color:var(--pico-ink-soft); }
.route-leaf-status { font-size:11px; font-weight:600; flex:0 0 auto; }
.route-leaf-status--true { color:var(--pico-accent-deep); }
.route-leaf-status--false,.route-leaf-status--skip,.route-leaf-status--pending { color:var(--pico-ink-soft); }
.route-card-note { color:var(--pico-ink-soft); font-size:10px; margin-top:2px; }
.route-dest { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--pico-hairline); border-radius:var(--pico-radius); background:var(--pico-surface); }
.route-dest-gateway { font-size:13px; font-weight:700; color:var(--pico-ink); white-space:nowrap; }
.route-dest-line { flex:1; height:3px; border-radius:2px; min-width:40px; }
.route-dest-line--active { background:var(--pico-accent); }
.route-dest-line--idle { background:var(--pico-hairline); }
.route-dest-target { font-size:13px; font-weight:700; white-space:nowrap; }
.route-dest-target--set { color:var(--pico-accent-deep); }
.route-dest-target--idle { color:var(--pico-ink-soft); }
@media (max-width:820px) {
  .pico-world-route-shell { grid-template-columns:1fr; grid-template-rows:minmax(650px,1fr) minmax(620px,1fr); height:auto; min-height:100dvh; overflow:visible; }
  .pico-world-route-code { border-right:0; border-bottom:var(--pico-line); }
  .pico-world-route-fields { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
