<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英语完形填空出题器：列表与大语言模型</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
</style>
<style>/* ============================================================
   Pico Visual Identity v0.6
   实现即规范；语义说明见 visual-identity.md。
   .pico-shell 是推荐骨架，不是 playground 的强制布局。
   所有共享选择器以 .pico- 前缀命名；World 局部样式一律
   使用 pico-world-<playground-id> 前缀，不得覆盖本文件。
   ============================================================ */

@font-face {
  font-family: "Pico WenKai 103";
  src: url("./fonts/lxgwwenkaiscreen-subset-103.woff2") format("woff2");
  font-display: swap;
}
@font-face { font-family: "Pico WenKai 105"; src: url("./fonts/lxgwwenkaiscreen-subset-105.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 108"; src: url("./fonts/lxgwwenkaiscreen-subset-108.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 111"; src: url("./fonts/lxgwwenkaiscreen-subset-111.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 112"; src: url("./fonts/lxgwwenkaiscreen-subset-112.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 113"; src: url("./fonts/lxgwwenkaiscreen-subset-113.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 114"; src: url("./fonts/lxgwwenkaiscreen-subset-114.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 115"; src: url("./fonts/lxgwwenkaiscreen-subset-115.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 116"; src: url("./fonts/lxgwwenkaiscreen-subset-116.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 117"; src: url("./fonts/lxgwwenkaiscreen-subset-117.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 118"; src: url("./fonts/lxgwwenkaiscreen-subset-118.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 119"; src: url("./fonts/lxgwwenkaiscreen-subset-119.woff2") format("woff2"); font-display: swap; }

:root {
  color-scheme: light dark;
  --pico-paper: #fbfbfa;
  --pico-surface: #f3f3f1;
  --pico-surface-raised: #ffffff;
  --pico-ink: #202022;
  --pico-ink-soft: #66666d;
  --pico-hairline: #d9d9d5;
  --pico-accent: #6d4aff;
  --pico-accent-deep: #5535da;
  --pico-accent-wash: #eeeaff;
  --pico-on-accent: #ffffff;
  --pico-code-bg: #f7f7f5;
  --pico-code-ink: var(--pico-ink);
  --pico-code-dim: #a0a09d;
  --pico-syn-key: #6d4aff;
  --pico-syn-fn: #4f46a5;
  --pico-syn-str: #287058;
  --pico-syn-num: #9a5b13;
  --pico-syn-com: #74747a;
  --pico-font-text: "Pico WenKai 103", "Pico WenKai 105", "Pico WenKai 108",
    "Pico WenKai 111", "Pico WenKai 112",
    "Pico WenKai 113", "Pico WenKai 114", "Pico WenKai 115",
    "Pico WenKai 116", "Pico WenKai 117", "Pico WenKai 118",
    "Pico WenKai 119", "LXGW WenKai Screen", "LXGW WenKai", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --pico-font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --pico-font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo,
    Consolas, "LXGW WenKai Screen", "LXGW WenKai", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", monospace;
  --pico-size-xs: 13px;
  --pico-size-sm: 15px;
  --pico-size-code: 16px;
  --pico-size-md: 18px;
  --pico-size-lg: 22px;
  --pico-size-xl: 30px;
  --pico-space-1: 4px;
  --pico-space-2: 8px;
  --pico-space-3: 12px;
  --pico-space-4: 16px;
  --pico-space-5: 24px;
  --pico-space-6: 40px;
  --pico-radius-sm: 3px;
  --pico-radius: 6px;
  --pico-line: 1px solid var(--pico-hairline);
  --pico-shadow: 0 1px 3px rgba(32, 32, 34, .08);
  --pico-ease-out: cubic-bezier(.2, .8, .2, 1);
  --pico-duration-fast: 140ms;
  --pico-duration-move: 240ms;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-pico-theme="light"]) {
    --pico-paper: #151516;
    --pico-surface: #1d1d20;
    --pico-surface-raised: #242428;
    --pico-ink: #f1f0ee;
    --pico-ink-soft: #b5b3b8;
    --pico-hairline: #46464c;
    --pico-accent: #a78bfa;
    --pico-accent-deep: #c4b5fd;
    --pico-accent-wash: rgba(167, 139, 250, .16);
    --pico-on-accent: #22133d;
    --pico-code-bg: #111113;
    --pico-code-dim: #7e7e86;
    --pico-syn-key: #d2a8ff;
    --pico-syn-fn: #b9a1ff;
    --pico-syn-str: #8ddbaf;
    --pico-syn-num: #e6b86b;
    --pico-syn-com: #92929a;
    --pico-shadow: 0 1px 3px rgba(0, 0, 0, .3);
  }
}

:root[data-pico-theme="dark"] {
  --pico-paper: #151516;
  --pico-surface: #1d1d20;
  --pico-surface-raised: #242428;
  --pico-ink: #f1f0ee;
  --pico-ink-soft: #b5b3b8;
  --pico-hairline: #46464c;
  --pico-accent: #a78bfa;
  --pico-accent-deep: #c4b5fd;
  --pico-accent-wash: rgba(167, 139, 250, .16);
  --pico-on-accent: #22133d;
  --pico-code-bg: #111113;
  --pico-code-dim: #7e7e86;
  --pico-syn-key: #d2a8ff;
  --pico-syn-fn: #b9a1ff;
  --pico-syn-str: #8ddbaf;
  --pico-syn-num: #e6b86b;
  --pico-syn-com: #92929a;
  --pico-shadow: 0 1px 3px rgba(0, 0, 0, .3);
}

* { box-sizing: border-box; }

.pico-root {
  margin: 0;
  color: var(--pico-ink);
  background: var(--pico-paper);
  font: var(--pico-size-md)/1.65 var(--pico-font-text);
}

.pico-root ::selection { background: var(--pico-accent-wash); }
.pico-root button,
.pico-root input,
.pico-root select { font: inherit; }

.pico-root button:focus-visible,
.pico-root input:focus-visible,
.pico-root select:focus-visible {
  outline: 2px solid var(--pico-accent);
  outline-offset: 3px;
}

/* 公共讲义骨架 */
.pico-shell {
  display: grid;
  grid-template-columns: 43fr 57fr;
  grid-template-rows: minmax(0, 1fr);
  overflow: hidden;
  border: var(--pico-line);
  border-radius: var(--pico-radius);
  background: var(--pico-surface-raised);
}

.pico-code,
.pico-world {
  display: flex;
  min-width: 0;
  min-height: 0;
  flex-direction: column;
}

.pico-code {
  border-right: var(--pico-line);
  background: var(--pico-code-bg);
}

.pico-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 44px;
  padding: 0 var(--pico-space-4);
  background: var(--pico-paper);
}

.pico-panel-title {
  margin: 0;
  color: var(--pico-ink-soft);
  font: 600 var(--pico-size-lg)/1 var(--pico-font-text);
}

.pico-panel-title--world {
  color: var(--pico-ink);
}

.pico-panel-actions {
  display: flex;
  align-items: center;
  gap: var(--pico-space-2);
}

/* 编辑器外观。CodeMirror 主题应映射到同一批 token。 */
.pico-w-editor-host {
  display: flex;
  flex: 1;
  width: 100%;
  height: 100%;
  min-height: 0;
  min-width: 0;
  position: relative;
  overflow: hidden;
}

.pico-w-editor-host .cm-editor {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  min-height: 0;
  min-width: 0;
  flex: 1;
}

.pico-w-editor-host .cm-scroller {
  overflow: auto;
}

.pico-editor {
  flex: 1;
  margin: 0;
  overflow: auto;
  padding: 18px 0;
  color: var(--pico-ink);
  background: var(--pico-code-bg);
  font: var(--pico-size-code)/1.8 var(--pico-font-mono);
  tab-size: 4;
}

.pico-line {
  display: block;
  min-height: 1.8em;
  padding-right: 18px;
  border-left: 3px solid transparent;
  white-space: pre;
}

.pico-current-line {
  border-left-color: var(--pico-accent);
  background: var(--pico-accent-wash);
}

.pico-ln {
  display: inline-block;
  width: 3.4em;
  padding-right: var(--pico-space-4);
  color: var(--pico-code-dim);
  text-align: right;
  user-select: none;
}

.pico-kw { color: var(--pico-syn-key); font-weight: 600; }
.pico-fn { color: var(--pico-syn-fn); }
.pico-str { color: var(--pico-syn-str); }
.pico-num { color: var(--pico-syn-num); }
.pico-com { color: var(--pico-syn-com); font-style: italic; }

.pico-functions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: var(--pico-space-3) var(--pico-space-4);
  border-top: var(--pico-line);
  background: var(--pico-surface);
}

.pico-world-note {
  padding: var(--pico-space-4);
  color: var(--pico-ink-soft);
  font-size: var(--pico-size-sm);
}

.pico-function {
  min-height: 28px;
  padding: 4px 8px;
  border: 1px solid transparent;
  border-radius: var(--pico-radius-sm);
  color: color-mix(in srgb, var(--pico-accent-deep) 52%, var(--pico-ink-soft));
  background: color-mix(in srgb, var(--pico-accent-wash) 52%, var(--pico-surface));
  cursor: pointer;
  font: 500 var(--pico-size-xs)/1.2 var(--pico-font-mono);
  transition: border-color var(--pico-duration-fast), background var(--pico-duration-fast), transform 80ms;
}

.pico-function:hover { border-color: color-mix(in srgb, var(--pico-accent) 28%, var(--pico-hairline)); background: color-mix(in srgb, var(--pico-accent-wash) 72%, var(--pico-surface)); }
.pico-function:active { transform: translateY(1px); }

.pico-status {
  display: inline-flex;
  min-height: 28px;
  align-items: center;
  padding: 4px 8px;
  border: var(--pico-line);
  border-radius: var(--pico-radius-sm);
  color: var(--pico-ink-soft);
  background: var(--pico-surface);
  font: 500 var(--pico-size-xs)/1.2 var(--pico-font-ui);
}

/* input/output、错误与预览也是跨课程公共能力。 */
.pico-io {
  padding: var(--pico-space-3) var(--pico-space-4);
  border-top: var(--pico-line);
  background: var(--pico-paper);
  font: var(--pico-size-md)/1.6 var(--pico-font-text);
}

.pico-io-row { min-height: 1.6em; white-space: pre-wrap; overflow-wrap: anywhere; }
.pico-io-stderr { color: var(--pico-accent-deep); }
.pico-io-input { display: flex; align-items: center; gap: var(--pico-space-2); }
.pico-io-input .pico-input { flex: 1; min-width: 0; }

.pico-error {
  margin-top: var(--pico-space-2);
  padding-top: var(--pico-space-2);
  border-top: var(--pico-line);
  color: var(--pico-accent-deep);
}

.pico-preview { opacity: .48; outline: 1.5px dashed var(--pico-accent); outline-offset: 3px; }
.pico-preview-label { color: var(--pico-accent-deep); font: var(--pico-size-xs)/1 var(--pico-font-ui); }

.pico-scene {
  position: relative;
  display: grid;
  flex: 1;
  min-height: 0;
  place-items: center;
  overflow: hidden;
}

/* 运行与回放 */
.pico-runbar {
  display: grid;
  grid-template-columns: auto minmax(180px, 1fr) auto;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
  border-top: var(--pico-line);
  background: var(--pico-paper);
}

.pico-controls { display: flex; gap: 6px; }

.pico-btn {
  min-height: 36px;
  padding: 6px 13px;
  border: var(--pico-line);
  border-radius: var(--pico-radius);
  color: var(--pico-ink);
  background: var(--pico-surface-raised);
  cursor: pointer;
  font: 600 var(--pico-size-sm)/1 var(--pico-font-ui);
  transition: background var(--pico-duration-fast), border-color var(--pico-duration-fast), transform 80ms;
}

.pico-btn:hover { border-color: var(--pico-ink-soft); background: var(--pico-surface); }
.pico-btn:active { transform: translateY(1px); }
.pico-btn--primary { border-color: var(--pico-accent-deep); color: var(--pico-on-accent); background: var(--pico-accent); }
.pico-btn--primary:hover { background: var(--pico-accent-deep); }
.pico-btn--icon { width: 36px; padding: 0; font-size: 17px; }
.pico-btn--quiet { border-color: transparent; background: transparent; }
.pico-btn--quiet:hover { border-color: var(--pico-hairline); background: var(--pico-accent-wash); }
.pico-btn--small {
  min-height: 28px;
  padding: 4px 10px;
  font-size: var(--pico-size-sm);
  border-radius: var(--pico-radius-sm);
}
.pico-btn:disabled { opacity: .42; cursor: default; }

.pico-input {
  padding: var(--pico-space-2) var(--pico-space-3);
  border: var(--pico-line);
  border-radius: var(--pico-radius);
  color: var(--pico-ink);
  background: var(--pico-surface-raised);
  font: var(--pico-size-code)/1.4 var(--pico-font-mono);
}

.pico-input:focus { border-color: var(--pico-accent); }

.pico-select {
  min-height: 34px;
  padding: 6px 34px 6px 11px;
  appearance: none;
  border: var(--pico-line);
  border-radius: var(--pico-radius);
  color: var(--pico-ink);
  background-color: var(--pico-surface-raised);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--pico-ink-soft) 50%),
    linear-gradient(135deg, var(--pico-ink-soft) 50%, transparent 50%);
  background-position:
    calc(100% - 16px) calc(50% - 2px),
    calc(100% - 11px) calc(50% - 2px);
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  cursor: pointer;
  font: 500 var(--pico-size-sm)/1.2 var(--pico-font-ui);
  transition: border-color var(--pico-duration-fast), background-color var(--pico-duration-fast);
}

.pico-select:hover { border-color: color-mix(in srgb, var(--pico-ink-soft) 58%, var(--pico-hairline)); }
.pico-select:focus { border-color: var(--pico-accent); outline: 2px solid var(--pico-accent-wash); outline-offset: 2px; }
.pico-select:disabled { opacity: .48; cursor: default; }
.pico-select option { color: var(--pico-ink); background: var(--pico-surface-raised); }
.pico-timeline { display: grid; gap: 9px; }
.pico-timeline-meta { display: flex; justify-content: space-between; color: var(--pico-ink-soft); font: 12px/1 var(--pico-font-ui); }

.pico-slider {
  --pico-progress: 0%;
  width: 100%;
  height: 20px;
  margin: 0;
  appearance: none;
  background: transparent;
  cursor: pointer;
}

.pico-slider::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--pico-accent) var(--pico-progress), var(--pico-hairline) var(--pico-progress));
}

.pico-slider::-webkit-slider-thumb {
  width: 16px;
  height: 16px;
  margin-top: -6px;
  appearance: none;
  border: 3px solid var(--pico-paper);
  border-radius: 50%;
  background: var(--pico-accent);
  box-shadow: 0 0 0 1px var(--pico-accent-deep);
}

.pico-slider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--pico-hairline); }
.pico-slider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--pico-accent); }
.pico-slider::-moz-range-thumb { width: 12px; height: 12px; border: 2px solid var(--pico-paper); border-radius: 50%; background: var(--pico-accent); }
.pico-step { color: var(--pico-ink-soft); font: var(--pico-size-xs)/1 var(--pico-font-mono); white-space: nowrap; }

/* 公共动效语义。课程只组合，不另起一套时长和缓动。 */
.pico-enter { animation: pico-enter var(--pico-duration-move) var(--pico-ease-out) both; }
.pico-exit { animation: pico-exit var(--pico-duration-fast) ease both; }
.pico-move { transition: transform var(--pico-duration-move) var(--pico-ease-out); }
.pico-scale { transition: transform var(--pico-duration-fast) var(--pico-ease-out); }
.pico-scale[aria-current="true"] { transform: scale(1.05); }

@keyframes pico-enter { from { opacity: 0; transform: translateY(8px); } }
@keyframes pico-exit { to { opacity: 0; transform: translateY(-5px); } }

/* 展示页专用，不属于公共 VI。 */
.vi-page { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 30px 0 72px; }
.vi-header { display: flex; align-items: end; justify-content: space-between; gap: 24px; padding-bottom: 18px; border-bottom: var(--pico-line); }
.vi-header h1 { margin: 0; font-size: 26px; line-height: 1.25; }
.vi-header p { max-width: 42ch; margin: 0; color: var(--pico-ink-soft); font-size: var(--pico-size-sm); }
.vi-kicker, .vi-section > h2 { margin: 0; color: var(--pico-ink-soft); font: 650 var(--pico-size-xs)/1 var(--pico-font-ui); letter-spacing: .06em; }
.vi-kicker { margin-bottom: 5px; color: var(--pico-accent-deep); }
.vi-section { margin-top: 44px; }
.vi-section > h2 { margin-bottom: 16px; }
.vi-demo-shell { height: 570px; }
.vi-output { display: grid; gap: 9px; color: var(--pico-ink-soft); font: var(--pico-size-code)/1.5 var(--pico-font-mono); }
.vi-output span { opacity: .5; }
.vi-output span[aria-current="true"] { color: var(--pico-accent-deep); opacity: 1; }
.vi-samples { display: grid; gap: 34px; }
.vi-sample { padding-top: 14px; border-top: var(--pico-line); }
.vi-sample h3 { margin: 0 0 16px; color: var(--pico-ink-soft); font: 650 var(--pico-size-xs)/1 var(--pico-font-ui); }
.vi-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--pico-space-3); }
.vi-swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--pico-space-3); }
.vi-swatch { display: grid; gap: 6px; color: var(--pico-ink-soft); font: 11px/1.2 var(--pico-font-mono); }
.vi-swatch::before { content: ""; height: 52px; border: var(--pico-line); border-radius: var(--pico-radius-sm); background: var(--swatch); }
.vi-type-text { margin: 0; font-size: var(--pico-size-lg); }
.vi-type-code { margin: 0; font: var(--pico-size-code)/1.6 var(--pico-font-mono); }
.vi-io-demo { width: min(100%, 620px); border: var(--pico-line); border-radius: var(--pico-radius); overflow: hidden; }
.vi-preview-shape { width: 82px; height: 28px; border-radius: var(--pico-radius); background: var(--pico-ink-soft); }
.vi-motion { width: 64px; height: 32px; border: var(--pico-line); border-radius: var(--pico-radius); background: var(--pico-surface); animation: vi-motion 1.8s var(--pico-ease-out) infinite; }
@keyframes vi-motion { 0%, 20% { opacity: 0; transform: translateY(8px) scale(.96); } 45%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-5px); } }

@media (max-width: 760px) {
  .vi-page { width: min(100% - 24px, 680px); }
  .vi-header { align-items: start; flex-direction: column; }
  .pico-shell { grid-template-columns: 1fr; grid-template-rows: minmax(360px, auto) minmax(480px, auto); }
  .pico-code { border-right: 0; border-bottom: var(--pico-line); }
  .pico-runbar { grid-template-columns: auto minmax(0, 1fr) auto; padding: 14px; }
  .pico-step { justify-self: end; }
  .vi-demo-shell { height: auto; }
  .vi-swatches { grid-template-columns: repeat(3, 1fr); }
}

@media (pointer: coarse) {
  .pico-btn,
  .pico-btn--small,
  .pico-btn--icon,
  .pico-function,
  .pico-select { min-height: 44px; }
  .pico-slider { height: 44px; }
}

@media (prefers-reduced-motion: reduce) {
  .pico-root { scroll-behavior: auto; }
  .pico-enter,
  .pico-exit,
  .pico-move,
  .pico-scale,
  .vi-motion { animation: none !important; transition: none !important; }
  .pico-btn:active,
  .pico-function:active { transform: none; }
}
</style>

def _safe(v):

    def visit_While(self, node):

        block_id = "loop:" + str(node.lineno) + ":" + str(node.col_offset)

.pico-trace-explorer {
  container-type: inline-size;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  width: 100%;
  box-sizing: border-box;
  overflow: hidden;
  border: 1px solid var(--pico-line, #e2e8f0);
  border-radius: var(--pico-radius, 8px);
  color: var(--pico-ink, #0f172a);
  background: var(--pico-surface-raised, #ffffff);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
  font-family: var(--pico-font-text, system-ui, -apple-system, sans-serif);
}

/* \u9876\u90E8\u72B6\u6001\u4E0E\u6A21\u5F0F\u5207\u6362\u680F (\u5FAE\u578B\u6781\u7B80) */
.pico-trace-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 2px 10px;
  min-height: 24px;
  background: var(--pico-paper, #f8fafc);
  border-bottom: 1px solid var(--pico-line, #e2e8f0);
  box-sizing: border-box;
}

.pico-trace-summary {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  overflow: hidden;
}

.pico-trace-tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 1px 4px;
  border-radius: 3px;
  font-family: var(--pico-font-mono, ui-monospace, monospace);
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  background: #e2e8f0;
  color: #475569;
  flex-shrink: 0;
}

.pico-tag-fn { background: #e0e7ff; color: #3730a3; }
.pico-tag-loop, .pico-tag-iter { background: #fef3c7; color: #92400e; }
.pico-tag-branch { background: #dcfce7; color: #166534; }
.pico-tag-call { background: #dbeafe; color: #1e40af; }
.pico-tag-error { background: #fee2e2; color: #991b1b; }
.pico-tag-input { background: #fef3c7; color: #92400e; }

.pico-trace-title {
  overflow: hidden;
  font: 600 11.5px/1.2 var(--pico-font-mono, ui-monospace, monospace);
  color: var(--pico-ink, #0f172a);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pico-trace-line {
  padding: 0 4px;
  border-radius: 2px;
  background: var(--pico-surface, #ffffff);
  border: 1px solid var(--pico-hairline, #e2e8f0);
  font-family: var(--pico-font-mono, ui-monospace, monospace);
  font-size: 9.5px;
  font-weight: 600;
  color: var(--pico-accent, #6d4aff);
  flex-shrink: 0;
}

.pico-trace-crumbs {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--pico-font-mono, ui-monospace, monospace);
  font-size: 9.5px;
  color: #64748b;
}

.pico-trace-filter-group {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  background: transparent;
  padding: 0;
  border-radius: 3px;
  flex-shrink: 0;
}

.pico-trace-filter-btn {
  border: 1px solid var(--pico-line, #e2e8f0);
  background: var(--pico-surface, #f1f5f9);
  padding: 2px 6px !important;
  border-radius: 3px !important;
  font-size: 9.5px !important;
  line-height: 1.2 !important;
  height: 18px !important;
  min-height: unset !important;
  font-weight: 600;
  color: #64748b;
  cursor: pointer;
  transition: all 0.1s ease;
  white-space: nowrap;
  box-sizing: border-box;
}

.pico-trace-filter-btn:hover {
  color: #0f172a;
  border-color: #cbd5e1;
}

.pico-trace-filter-btn--active {
  background: #2563eb !important;
  border-color: #2563eb !important;
  color: #ffffff !important;
  box-shadow: 0 1px 2px rgba(37, 99, 235, 0.2);
}

/* \u6C34\u5E73\u5FAE\u578B\u53D8\u91CF\u80F6\u56CA\u533A */
.pico-trace-vars-deck {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 1px 10px;
  height: 22px;
  min-height: 22px;
  max-height: 22px;
  overflow-x: auto;
  overflow-y: hidden;
  flex-wrap: nowrap;
  background: #ffffff;
  border-bottom: 1px solid var(--pico-hairline, #f1f5f9);
  scrollbar-width: thin;
  box-sizing: border-box;
}

.pico-trace-vars-empty {
  font-size: 9.5px;
  color: var(--pico-ink-soft, #94a3b8);
  font-style: italic;
}

.pico-trace-var-pill {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 0 5px;
  border-radius: 3px;
  border: 1px solid var(--pico-line, #e2e8f0);
  background: var(--pico-paper, #f8fafc);
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.12s ease;
  height: 18px;
  box-sizing: border-box;
}

.pico-trace-var-pill:hover {
  border-color: #94a3b8;
  background: #f1f5f9;
}

.pico-trace-var--changed {
  border-color: #6366f1;
  background: #eef2ff;
  box-shadow: 0 0 0 1px #818cf8;
}

.pico-trace-var-name {
  font-family: var(--pico-font-mono, ui-monospace, monospace);
  font-size: 9.5px;
  font-weight: 700;
  color: #475569;
}

.pico-trace-var--changed .pico-trace-var-name {
  color: #3730a3;
}

.pico-trace-var-sep {
  color: #94a3b8;
  font-size: 9px;
  font-family: var(--pico-font-mono, ui-monospace, monospace);
}

.pico-trace-var-watch {
  border: none;
  background: transparent;
  padding: 0;
  font-size: 9.5px;
  line-height: 1;
  color: #94a3b8;
  cursor: pointer;
}

.pico-trace-var-watch--active {
  color: #eab308;
}

.pico-trace-var-val {
  font-family: var(--pico-font-mono, ui-monospace, monospace);
  font-size: 9.5px;
  font-weight: 700;
  color: #0f172a;
  white-space: nowrap;
}

.pico-var-type-number { color: #b45309; }
.pico-var-type-string { color: #047857; }
.pico-var-type-boolean { color: #4338ca; }

.pico-trace-var-pill--inspecting {
  border-color: #2563eb !important;
  background: #eff6ff !important;
  box-shadow: 0 0 0 1px #2563eb;
}

/* \u53D8\u91CF\u5B8C\u6574\u503C\u8BE6\u60C5\u68C0\u67E5\u9762\u677F */
.pico-trace-popover {
  display: flex;
  flex-direction: column;
  background: var(--pico-surface-raised, #ffffff);
  border-bottom: 1px solid var(--pico-line, #e2e8f0);
  padding: 6px 10px;
  gap: 4px;
  box-sizing: border-box;
}

.pico-trace-popover-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.pico-trace-popover-meta {
  display: flex;
  align-items: center;
  gap: 6px;
}

.pico-trace-popover-name {
  font-family: var(--pico-font-mono, ui-monospace, monospace);
  font-size: 11px;
  font-weight: 700;
  color: #1e293b;
}

.pico-trace-popover-type {
  font-family: var(--pico-font-mono, ui-monospace, monospace);
  font-size: 9.5px;
  color: #64748b;
  background: #f1f5f9;
  padding: 1px 5px;
  border-radius: 3px;
  border: 1px solid #e2e8f0;
}

.pico-trace-popover-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}

.pico-trace-popover-btn {
  border: 1px solid var(--pico-line, #e2e8f0);
  background: var(--pico-surface, #f1f5f9);
  padding: 2px 6px !important;
  border-radius: 3px !important;
  font-size: 9.5px !important;
  line-height: 1.2 !important;
  height: 18px !important;
  min-height: unset !important;
  font-weight: 600;
  color: #64748b;
  cursor: pointer;
  transition: all 0.1s ease;
  white-space: nowrap;
  box-sizing: border-box;
}

.pico-trace-popover-btn:hover {
  color: #0f172a;
  border-color: #cbd5e1;
}

.pico-trace-popover-btn--active {
  background: #2563eb !important;
  border-color: #2563eb !important;
  color: #ffffff !important;
  box-shadow: 0 1px 2px rgba(37, 99, 235, 0.2);
}

.pico-trace-popover-close {
  border: 1px solid var(--pico-line, #e2e8f0);
  background: var(--pico-surface, #f1f5f9);
  padding: 0 5px !important;
  border-radius: 3px !important;
  font-size: 10px !important;
  line-height: 16px !important;
  height: 18px !important;
  min-height: unset !important;
  color: #94a3b8;
  cursor: pointer;
  box-sizing: border-box;
}

.pico-trace-popover-close:hover {
  color: #0f172a;
  border-color: #cbd5e1;
}

.pico-trace-popover-body {
  margin: 0;
  max-height: 120px;
  overflow-y: auto;
  overflow-x: auto;
  padding: 6px 8px;
  border-radius: 4px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  font-family: var(--pico-font-mono, ui-monospace, monospace);
  font-size: 11px;
  line-height: 1.4;
  color: #0f172a;
  white-space: pre-wrap;
  word-break: break-all;
  scrollbar-width: thin;
}

/* \u7ED3\u6784\u706B\u7130\u56FE (\u9AD8\u5EA6\u81EA\u9002\u5E94\u5185\u5BB9\u5C42\u6DF1\uFF1A\u5355\u5C42\u7D27\u51D1\uFF0C\u591A\u5C42\u8212\u5C55) */
.pico-trace-focus {
  position: relative;
  min-height: 36px;
  max-height: 180px;
  margin: 4px 8px;
  overflow-y: auto;
  overflow-x: hidden;
  background: #f8fafc;
  background-image: linear-gradient(to right, #f1f5f9 1px, transparent 1px);
  background-size: 20px 100%;
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  scrollbar-width: thin;
}

.pico-trace-block {
  position: absolute;
  top: calc(var(--pico-trace-row) * 28px + 3px);
  left: var(--pico-trace-left);
  width: var(--pico-trace-width);
  min-width: 4px;
  height: 24px;
  overflow: hidden;
  padding: 0 6px;
  border-radius: 4px;
  font: 600 11px/24px var(--pico-font-mono, ui-monospace, monospace);
  text-overflow: ellipsis;
  white-space: nowrap;
  box-sizing: border-box;
  user-select: none;
  transition: all 0.1s ease;
}

.pico-trace-root {
  background: #f1f5f9;
  border: 1px solid #cbd5e1;
  color: #334155;
}

.pico-trace-kind-function { background: #eef2ff; border: 1px solid #c7d2fe; color: #3730a3; }
.pico-trace-kind-loop { background: #fef3c7; border: 1px solid #fde68a; color: #92400e; }
.pico-trace-kind-iteration { background: #fffbeb; border: 1px solid #fef08a; color: #854d0e; text-align: center; }
.pico-trace-kind-branch { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }

.pico-trace-block[data-active="true"] {
  border-color: #6366f1;
  box-shadow: 0 1px 3px rgba(99, 102, 241, 0.25);
}

.pico-trace-block[data-current="true"] {
  border-color: #1d4ed8;
  color: #ffffff !important;
  background: #2563eb !important;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.45);
  font-weight: 700;
  z-index: 2;
}

.pico-trace-cursor {
  position: absolute;
  z-index: 4;
  inset-block: 0;
  width: 2px;
  background: #2563eb;
  pointer-events: none;
}

.pico-trace-cursor::before {
  content: "";
  position: absolute;
  top: 0;
  left: -3px;
  width: 8px;
  height: 8px;
  background: #2563eb;
  border-radius: 2px;
  transform: rotate(45deg);
}

.pico-trace-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 10px;
  height: 26px;
  border-top: 1px solid var(--pico-line, #e2e8f0);
  background: var(--pico-paper, #f8fafc);
  box-sizing: border-box;
}

.pico-trace-step-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: 3px;
  border: 1px solid #cbd5e1;
  background: #ffffff;
  color: #475569;
  cursor: pointer;
  padding: 0;
  transition: all 0.12s ease;
  flex-shrink: 0;
}

.pico-trace-step-btn:hover:not(:disabled) { background: #f1f5f9; color: #0f172a; border-color: #94a3b8; }
.pico-trace-step-btn:active:not(:disabled) { transform: scale(0.96); }
.pico-trace-step-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.pico-trace-slider {
  --pico-trace-progress: 0%;
  flex: 1;
  min-width: 0;
  height: 14px;
  margin: 0;
  appearance: none;
  background: transparent;
  cursor: pointer;
}

.pico-trace-slider::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 2px;
  background: linear-gradient(90deg, #2563eb var(--pico-trace-progress), #cbd5e1 var(--pico-trace-progress));
}

.pico-trace-slider::-webkit-slider-thumb {
  width: 12px;
  height: 12px;
  margin-top: -4px;
  appearance: none;
  border: 2px solid #ffffff;
  border-radius: 50%;

}

}

  border: var(--pico-line);

.cloze-tag--answer {

  color: var(--pico-accent-deep);

  }

  }
}
