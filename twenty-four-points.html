<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>24 点</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
</style>
<style>/* Pico VI：.pico-page + .pico-shell 为标准骨架；课程局部样式使用 pico-world-<id> 前缀。 */

@font-face {
  font-family: "Pico WenKai 103";
  src: url("./fonts/lxgwwenkaiscreen-subset-103.woff2") format("woff2");
  font-display: swap;
}
@font-face { font-family: "Pico WenKai 105"; src: url("./fonts/lxgwwenkaiscreen-subset-105.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 108"; src: url("./fonts/lxgwwenkaiscreen-subset-108.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 111"; src: url("./fonts/lxgwwenkaiscreen-subset-111.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 112"; src: url("./fonts/lxgwwenkaiscreen-subset-112.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 113"; src: url("./fonts/lxgwwenkaiscreen-subset-113.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 114"; src: url("./fonts/lxgwwenkaiscreen-subset-114.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 115"; src: url("./fonts/lxgwwenkaiscreen-subset-115.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 116"; src: url("./fonts/lxgwwenkaiscreen-subset-116.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 117"; src: url("./fonts/lxgwwenkaiscreen-subset-117.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 118"; src: url("./fonts/lxgwwenkaiscreen-subset-118.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Pico WenKai 119"; src: url("./fonts/lxgwwenkaiscreen-subset-119.woff2") format("woff2"); font-display: swap; }

:root {
  color-scheme: light dark;
  --pico-paper: #f8f8fb;
  --pico-surface: #f0f1f6;
  --pico-surface-raised: rgba(255, 255, 255, 0.9);
  --pico-ink: #18181b;
  --pico-ink-soft: #646470;
  --pico-hairline: #dcdde4;
  --pico-accent: #7c65ff;
  --pico-accent-deep: #684bf5;
  --pico-accent-light: #8d77ff;
  --pico-accent-dark: #583cd6;
  --pico-accent-wash: rgba(124, 101, 255, 0.10);
  --pico-accent-glow: rgba(124, 101, 255, 0.32);
  --pico-on-accent: #ffffff;
  /* 语义色：结构回放标签与块（fn/loop/branch/error）；组件不得直接使用颜色字面量。 */
  --pico-hue-fn-bg: #eef2ff;
  --pico-hue-fn-ink: #3730a3;
  --pico-hue-fn-strong: #6366f1;
  --pico-hue-loop-bg: #fef3c7;
  --pico-hue-loop-ink: #92400e;
  --pico-hue-loop-strong: #d97706;
  --pico-hue-branch-bg: #ecfdf5;
  --pico-hue-branch-ink: #065f46;
  --pico-hue-branch-strong: #059669;
  --pico-hue-error-bg: #fee2e2;
  --pico-hue-error-ink: #991b1b;
  --pico-hue-error-strong: #dc2626;
  --pico-code-bg: #f5f5f9;
  --pico-code-ink: var(--pico-ink);
  --pico-code-dim: #9da0aa;
  --pico-syn-key: #7c65ff;
  --pico-syn-fn: #5e49cf;
  --pico-syn-str: #1f7a5c;
  --pico-syn-num: #a36118;
  --pico-syn-com: #767784;
  --pico-font-text: "Pico WenKai 103", "Pico WenKai 105", "Pico WenKai 108",
    "Pico WenKai 111", "Pico WenKai 112",
    "Pico WenKai 113", "Pico WenKai 114", "Pico WenKai 115",
    "Pico WenKai 116", "Pico WenKai 117", "Pico WenKai 118",
    "Pico WenKai 119", "LXGW WenKai Screen", "LXGW WenKai", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --pico-font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --pico-font-mono: "FiraCode Nerd Font Mono", "FiraCode Nerd Font",
    "Fira Code", ui-monospace, "SF Mono", "JetBrains Mono", Menlo,
    Consolas, "LXGW WenKai Screen", "LXGW WenKai", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", monospace;
  --pico-size-xs: 13px;
  --pico-size-sm: 15px;
  --pico-size-code: 16px;
  --pico-size-md: 18px;
  --pico-size-lg: 22px;
  --pico-size-xl: 30px;
  --pico-space-1: 4px;
  --pico-space-2: 8px;
  --pico-space-3: 12px;
  --pico-space-4: 16px;
  --pico-space-5: 24px;
  --pico-space-6: 40px;
  --pico-radius-sm: 4px;
  --pico-radius: 7.5px;
  --pico-line: 1px solid var(--pico-hairline);
  --pico-shadow: 0 1px 3px rgba(32, 32, 34, .08);
  --pico-ease-out: cubic-bezier(.16, 1, .3, 1);
  --pico-duration-fast: 120ms;
  --pico-duration-move: 240ms;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-pico-theme="light"]) {
    --pico-paper: #0e0e12;
    --pico-surface: #16161c;
    --pico-surface-raised: rgba(28, 28, 36, 0.85);
    --pico-ink: #f4f4f7;
    --pico-ink-soft: #a0a0ad;
    --pico-hairline: #383844;
    --pico-accent: #9378ff;
    --pico-accent-deep: #7c65ff;
    --pico-accent-light: #b49bff;
    --pico-accent-dark: #684bf5;
    --pico-accent-wash: rgba(147, 120, 255, 0.16);
    --pico-accent-glow: rgba(147, 120, 255, 0.40);
    --pico-on-accent: #ffffff;
    --pico-code-bg: #121217;
    --pico-code-dim: #767784;
    --pico-syn-key: #b49bff;
    --pico-syn-fn: #a38cf8;
    --pico-syn-str: #7ee2b0;
    --pico-syn-num: #f0c375;
    --pico-syn-com: #8a8a98;
    --pico-shadow: 0 1px 3px rgba(0, 0, 0, .4);
    --pico-hue-fn-bg: #1c1c32;
    --pico-hue-fn-ink: #c7d2fe;
    --pico-hue-fn-strong: #818cf8;
    --pico-hue-loop-bg: #32260e;
    --pico-hue-loop-ink: #fcd34d;
    --pico-hue-loop-strong: #fbbf24;
    --pico-hue-branch-bg: #0b281f;
    --pico-hue-branch-ink: #6ee7b7;
    --pico-hue-branch-strong: #34d399;
    --pico-hue-error-bg: #321616;
    --pico-hue-error-ink: #fca5a5;
    --pico-hue-error-strong: #ef4444;
  }
}

:root[data-pico-theme="dark"] {
  --pico-paper: #0e0e12;
  --pico-surface: #16161c;
  --pico-surface-raised: rgba(28, 28, 36, 0.85);
  --pico-ink: #f4f4f7;
  --pico-ink-soft: #a0a0ad;
  --pico-hairline: #383844;
  --pico-accent: #9378ff;
  --pico-accent-deep: #7c65ff;
  --pico-accent-light: #b49bff;
  --pico-accent-dark: #684bf5;
  --pico-accent-wash: rgba(147, 120, 255, 0.16);
  --pico-accent-glow: rgba(147, 120, 255, 0.40);
  --pico-on-accent: #ffffff;
  --pico-code-bg: #121217;
  --pico-code-dim: #767784;
  --pico-syn-key: #b49bff;
  --pico-syn-fn: #a38cf8;
  --pico-syn-str: #7ee2b0;
  --pico-syn-num: #f0c375;
  --pico-syn-com: #8a8a98;
  --pico-shadow: 0 1px 3px rgba(0, 0, 0, .4);
  --pico-hue-fn-bg: #1c1c32;
  --pico-hue-fn-ink: #c7d2fe;
  --pico-hue-fn-strong: #818cf8;
  --pico-hue-loop-bg: #32260e;
  --pico-hue-loop-ink: #fcd34d;
  --pico-hue-loop-strong: #fbbf24;
  --pico-hue-branch-bg: #0b281f;
  --pico-hue-branch-ink: #6ee7b7;
  --pico-hue-branch-strong: #34d399;
  --pico-hue-error-bg: #321616;
  --pico-hue-error-ink: #fca5a5;
  --pico-hue-error-strong: #ef4444;
}

* { box-sizing: border-box; }

.pico-root {
  margin: 0;
  color: var(--pico-ink);
  background: var(--pico-paper);
  font: var(--pico-size-md)/1.65 var(--pico-font-text);
}

.pico-root ::selection { background: var(--pico-accent-wash); }
.pico-root button,
.pico-root input,
.pico-root select { font: inherit; }

.pico-root button:focus-visible,
.pico-root input:focus-visible,
.pico-root select:focus-visible {
  outline: 2px solid var(--pico-accent);
  outline-offset: 3px;
}

/* 公共讲义骨架 */
.pico-page {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  padding: 18px;
  background: var(--pico-paper);
}

.pico-shell {
  display: grid;
  grid-template-columns: 43fr 57fr;
  grid-template-rows: minmax(0, 1fr);
  width: 100%;
  height: 100%;
  overflow: hidden;
  border: var(--pico-line);
  border-radius: var(--pico-radius);
  background: var(--pico-surface-raised);
}

.pico-shell--world-only { grid-template-columns: minmax(0, 1fr); }

.pico-code,
.pico-world {
  display: flex;
  min-width: 0;
  min-height: 0;
  flex-direction: column;
}

.pico-code {
  border-right: var(--pico-line);
  background: var(--pico-code-bg);
}

.pico-editor {
  flex: 1;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

.pico-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 44px;
  padding: 0 var(--pico-space-4);
  background: var(--pico-paper);
}

.pico-panel-title {
  margin: 0;
  color: var(--pico-ink-soft);
  font: 600 var(--pico-size-lg)/1 var(--pico-font-text);
}

.pico-panel-title--world {
  color: var(--pico-ink);
}

.pico-panel-actions {
  display: flex;
  align-items: center;
  gap: var(--pico-space-2);
}

/* 编辑器外观。CodeMirror 主题应映射到同一批 token。 */
.pico-w-editor-host {
  display: flex;
  flex: 1;
  width: 100%;
  height: 100%;
  min-height: 0;
  min-width: 0;
  position: relative;
  overflow: hidden;
}

.pico-w-editor-host .cm-editor {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  min-height: 0;
  min-width: 0;
  flex: 1;
}

.pico-w-editor-host .cm-scroller {
  overflow: auto;
}

.pico-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: var(--pico-space-3) var(--pico-space-4);
  border-top: var(--pico-line);
  background: var(--pico-surface);
}

.pico-status {
  display: inline-flex;
  min-height: 28px;
  align-items: center;
  padding: 4px 8px;
  border: var(--pico-line);
  border-radius: var(--pico-radius-sm);
  color: var(--pico-ink-soft);
  background: var(--pico-surface);
  font: 500 var(--pico-size-xs)/1.2 var(--pico-font-ui);
}

.pico-status-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--pico-space-2);
  padding: var(--pico-space-2) var(--pico-space-4);
  border-bottom: var(--pico-line);
  background: var(--pico-surface);
}

/* input/output、错误与预览也是跨课程公共能力。 */
.pico-io {
  padding: var(--pico-space-3) var(--pico-space-4);
  border-top: var(--pico-line);
  background: var(--pico-paper);
  font: var(--pico-size-md)/1.6 var(--pico-font-text);
}

.pico-io-row {
  min-height: 1.6em;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: var(--pico-font-mono);
  font-size: var(--pico-size-code);
}
.pico-io-stderr { color: var(--pico-hue-error-ink); }
.pico-io-input { display: flex; align-items: center; gap: var(--pico-space-2); }
.pico-io-input .pico-input { flex: 1; min-width: 0; }

.pico-error {
  margin-top: var(--pico-space-2);
  padding-top: var(--pico-space-2);
  border-top: var(--pico-line);
  color: var(--pico-hue-error-ink);
}

.pico-scene {
  position: relative;
  display: grid;
  flex: 1;
  min-height: 0;
  place-items: center;
  overflow: hidden;
}

.pico-world-error {
  position: absolute;
  top: var(--pico-space-3);
  right: var(--pico-space-3);
  z-index: 4;
  display: flex;
  max-width: calc(100% - 2 * var(--pico-space-3));
  align-items: center;
  gap: var(--pico-space-2);
  padding: 6px 10px;
  border: 1px solid var(--pico-hue-error-strong);
  border-radius: var(--pico-radius);
  color: var(--pico-hue-error-ink);
  background: var(--pico-hue-error-bg);
  box-shadow: var(--pico-shadow);
  pointer-events: none;
  font: 600 var(--pico-size-xs)/1.2 var(--pico-font-ui);
}

.pico-world-error[hidden] { display: none; }

.pico-world-error-mark {
  display: grid;
  width: 24px;
  height: 24px;
  flex: 0 0 auto;
  place-items: center;
  border: 2px solid currentColor;
  border-radius: 50%;
  font-size: 15px;
}

.pico-world-error-label { overflow-wrap: anywhere; }

.pico-trace {
  flex-shrink: 0;
  padding: 10px var(--pico-space-4);
  border-top: var(--pico-line);
  background: var(--pico-paper);
}

.pico-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 34px;
  padding: 6px 14px;
  border: 1px solid var(--pico-hairline);
  border-radius: var(--pico-radius);
  color: var(--pico-ink);
  background: linear-gradient(180deg, var(--pico-surface-raised) 0%, var(--pico-surface) 100%);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  cursor: pointer;
  font: 600 var(--pico-size-sm)/1 var(--pico-font-ui);
  box-shadow:
    0 1.5px 0 rgba(0, 0, 0, 0.08),
    0 2px 6px rgba(0, 0, 0, 0.03),
    inset 0 1px 0 rgba(255, 255, 255, 0.85);
  transition: transform 0.08s ease, box-shadow 0.08s ease, border-color var(--pico-duration-fast), background var(--pico-duration-fast), color var(--pico-duration-fast);
  user-select: none;
  box-sizing: border-box;
}

.pico-btn:hover {
  border-color: var(--pico-accent-light);
  color: var(--pico-accent);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(250, 248, 255, 0.85) 100%);
  box-shadow:
    0 2px 0 rgba(0, 0, 0, 0.08),
    0 4px 12px var(--pico-accent-wash);
}

.pico-btn:active {
  transform: translateY(1.5px);
  box-shadow: 0 0 0 transparent, inset 0 1.5px 2px rgba(0, 0, 0, 0.12);
}

.pico-btn--primary {
  border-color: var(--pico-accent-dark);
  color: var(--pico-on-accent);
  background: linear-gradient(180deg, var(--pico-accent-light) 0%, var(--pico-accent-deep) 100%);
  box-shadow:
    0 1.5px 0 var(--pico-accent-dark),
    0 4px 14px var(--pico-accent-glow),
    inset 0 1px 0 rgba(255, 255, 255, 0.55),
    inset 0 -1px 0 rgba(0, 0, 0, 0.15);
}

.pico-btn--primary:hover {
  filter: brightness(1.05);
  color: #ffffff;
  background: linear-gradient(180deg, var(--pico-accent-light) 0%, var(--pico-accent) 100%);
  box-shadow:
    0 2px 0 var(--pico-accent-dark),
    0 6px 20px var(--pico-accent-glow),
    inset 0 1px 0 rgba(255, 255, 255, 0.65);
}

.pico-btn--primary:active {
  transform: translateY(1.5px);
  box-shadow: 0 0 0 transparent, inset 0 1.5px 2px rgba(0, 0, 0, 0.3);
}

.pico-btn--icon {
  width: 34px;
  height: 34px;
  min-height: 34px;
  padding: 0;
  font-size: 15px;
  border-radius: var(--pico-radius);
}

.pico-btn--quiet {
  border-color: transparent;
  background: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  box-shadow: none;
  color: var(--pico-ink-soft);
}

.pico-btn--quiet:hover {
  border-color: transparent;
  background: var(--pico-accent-wash);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: var(--pico-accent);
  box-shadow: none;
}

.pico-btn--quiet:active {
  transform: translateY(1px);
  box-shadow: none;
}

.pico-btn--small {
  min-height: 28px;
  height: 28px;
  padding: 3px 10px;
  font-size: 13px;
  border-radius: var(--pico-radius-sm);
}

.pico-btn:disabled {
  opacity: .42;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

.pico-input {
  padding: var(--pico-space-2) var(--pico-space-3);
  border: var(--pico-line);
  border-radius: var(--pico-radius);
  color: var(--pico-ink);
  background: var(--pico-surface-raised);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font: var(--pico-size-code)/1.4 var(--pico-font-mono);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
  transition: border-color var(--pico-duration-fast), box-shadow var(--pico-duration-fast);
}

.pico-input:focus {
  outline: none;
  border-color: var(--pico-accent);
  box-shadow: 0 0 0 3px var(--pico-accent-wash), inset 0 1px 2px rgba(0, 0, 0, 0.04);
}

@media (max-width: 760px) {
  .pico-page { min-height: 100%; height: auto; padding: 12px; }
  .pico-shell { grid-template-columns: 1fr; grid-template-rows: minmax(360px, auto) minmax(480px, auto); }
  .pico-shell--world-only { grid-template-rows: minmax(480px, auto); }
  .pico-code { border-right: 0; border-bottom: var(--pico-line); }
}

@media (pointer: coarse) {
  .pico-btn,
  .pico-btn--small,
  .pico-btn--icon { min-height: 44px; }
}

@media (prefers-reduced-motion: reduce) {
  .pico-root { scroll-behavior: auto; }
  .pico-btn:active { transform: none; }
}

/* Turtle 运行时布局与主题呈现 */
.pico-turtle-view {
  justify-self: stretch;
  align-self: stretch;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  box-sizing: border-box;
}

.pico-turtle-frame {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
}

.pico-turtle-frame svg {
  display: block;
  width: 100%;
  height: 100%;
}

/* 交互控制台：程序 I/O 的终端窗口，住在代码面板底部、与编辑器同色系，不抢焦点 */
.pico-io-console {
  display: flex;
  flex-direction: column;
  gap: var(--pico-space-2);
  box-sizing: border-box;
  padding: var(--pico-space-3) var(--pico-space-4) var(--pico-space-4);
  border-top: var(--pico-line);
  background: var(--pico-surface);
  font: var(--pico-size-code)/1.7 var(--pico-font-mono);
}

.pico-io-console[hidden] { display: none; }

.pico-io-console-lines {
  display: flex;
  flex-direction: column;
  gap: var(--pico-space-1);
  max-height: 10em;
  overflow-y: auto;
  scrollbar-width: thin;
}

/* 程序输出 block：保留其中的换行；stderr 用错误色 */
.pico-io-console .pico-io-row {
  min-height: 1.6em;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--pico-ink);
}

.pico-io-console .pico-io-stderr {
  padding-left: var(--pico-space-2);
  border-left: 2px solid var(--pico-hue-error-ink);
  color: var(--pico-hue-error-ink);
}

/* 已提交的一次 input() 交换：❯ 强调色提示符 + 弱墨提示 + 主墨答案，
   一眼区分「程序问」和「你答」 */
.pico-io-exchange {
  display: flex;
  align-items: baseline;
  gap: var(--pico-space-2);
  min-height: 1.6em;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.pico-io-exchange-marker,
.pico-io-input-marker {
  flex: 0 0 auto;
  color: var(--pico-syn-key);
  user-select: none;
}

.pico-io-exchange-prompt {
  flex: 0 0 auto;
  white-space: pre-wrap;
  color: var(--pico-ink-soft);
}

.pico-io-exchange-answer {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--pico-ink);
}

/* 等待中的输入行：仍是 conversation 最后一行，但长输出滚动时固定在 viewport 底部 */
.pico-io-row + .pico-io-input,
.pico-io-exchange + .pico-io-input {
  margin-top: var(--pico-space-1);
  padding-top: var(--pico-space-2);
  border-top: var(--pico-line);
}

.pico-io-input {
  display: flex;
  align-items: center;
  gap: var(--pico-space-2);
  flex: 0 0 auto;
  position: sticky;
  bottom: 0;
  z-index: 1;
  background: var(--pico-surface);
}

.pico-io-input-prompt {
  flex: 0 0 auto;
  white-space: pre-wrap;
  color: var(--pico-ink-soft);
}

.pico-io-input-hint {
  flex: 0 0 auto;
  color: var(--pico-code-dim);
}

/* 控制台里的输入框是终端行内字段：无边框无底色，聚焦时点出强调色下划线 */
.pico-io-console .pico-input {
  flex: 1;
  min-width: 0;
  padding: 1px var(--pico-space-2);
  border: none;
  border-bottom: 1px solid var(--pico-hairline);
  border-radius: 0;
  color: var(--pico-ink);
  background: transparent;
  box-shadow: none;
  caret-color: var(--pico-accent);
}

.pico-io-console .pico-input:focus {
  outline: none;
  border-bottom-color: var(--pico-accent);
  box-shadow: 0 1px 0 var(--pico-accent);
}

.pico-io-restart {
  align-self: flex-end;
  border: 0;
  color: var(--pico-code-dim);
  background: transparent;
  font: 600 var(--pico-size-xs)/1.2 var(--pico-font-ui);
  cursor: pointer;
}

.pico-turtle-view .pico-canvas-frame rect,
.pico-turtle-view .pico-overlay-grid line { stroke: var(--pico-hairline); }
.pico-turtle-view .pico-overlay-axes line { stroke: var(--pico-ink-soft); }
.pico-turtle-view .pico-overlay-axes text,
.pico-turtle-view .pico-overlay-axes circle { fill: var(--pico-ink-soft); }

/* 课程局部样式：pico-world-<id>-* 前缀，颜色只用 --pico-* token。 */
.pico-world-twenty-four-points-cards-rack {
  display: flex;
  gap: var(--pico-space-3);
  justify-content: center;
  align-items: center;
  padding: var(--pico-space-3) var(--pico-space-4);
  width: 100%;
}

.pico-world-twenty-four-points-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 64px;
  height: 90px;
  border: var(--pico-line);
  border-radius: var(--pico-radius);
  background: var(--pico-surface-raised);
  box-shadow: var(--pico-shadow);
  position: relative;
  transition: border-color var(--pico-duration-fast), transform var(--pico-duration-fast), opacity var(--pico-duration-fast);
}

.pico-world-twenty-four-points-card--used {
  border-color: var(--pico-hairline);
  opacity: 0.85;
}

.pico-world-twenty-four-points-card-rank {
  font: 700 var(--pico-size-lg)/1 var(--pico-font-mono);
  color: var(--pico-ink);
}

.pico-world-twenty-four-points-card-suit {
  font-size: var(--pico-size-md);
  margin-top: var(--pico-space-1);
}

.pico-world-twenty-four-points-card-suit--red {
  color: var(--pico-hue-error-strong);
}

.pico-world-twenty-four-points-card-suit--black {
  color: var(--pico-ink);
}

.pico-world-twenty-four-points-card-badge {
  position: absolute;
  bottom: -9px;
  font: 600 var(--pico-size-xs)/1 var(--pico-font-ui);
  padding: 2px 6px;
  border-radius: var(--pico-radius-sm);
  white-space: nowrap;
}

.pico-world-twenty-four-points-card-badge--ok {
  background: var(--pico-hue-branch-bg);
  color: var(--pico-hue-branch-ink);
  border: 1px solid var(--pico-hue-branch-strong);
}

.pico-world-twenty-four-points-card-badge--unused {
  background: var(--pico-surface);
  color: var(--pico-ink-soft);
  border: 1px solid var(--pico-hairline);
}

.pico-world-twenty-four-points-tree-container {
  display: flex;
  flex: 1;
  width: 100%;
  height: 100%;
  min-height: 220px;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.pico-world-twenty-four-points-svg {
  width: 100%;
  height: 100%;
  max-height: 380px;
}

.pico-world-twenty-four-points-trace-panel {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--pico-space-3);
  width: 100%;
}

.pico-world-twenty-four-points-slider {
  flex: 1;
  accent-color: var(--pico-accent);
}

.pico-world-twenty-four-points-step-desc {
  font: 500 var(--pico-size-sm)/1.2 var(--pico-font-ui);
  color: var(--pico-ink);
  min-width: 180px;
  text-align: right;
}

.pico-world-twenty-four-points-edge {
  stroke: var(--pico-hairline);
  stroke-width: 2;
  transition: stroke var(--pico-duration-fast);
}

.pico-world-twenty-four-points-edge--active {
  stroke: var(--pico-accent);
  stroke-width: 3;
}

.pico-world-twenty-four-points-node-op {
  fill: var(--pico-surface-raised);
  stroke: var(--pico-hairline);
  stroke-width: 2;
}

.pico-world-twenty-four-points-node-op--active {
  fill: var(--pico-accent);
  stroke: var(--pico-accent-deep);
  stroke-width: 2;
}

.pico-world-twenty-four-points-node-op-text {
  font-family: var(--pico-font-mono);
  font-size: 18px;
  font-weight: 700;
  fill: var(--pico-ink);
  text-anchor: middle;
  dominant-baseline: central;
}

.pico-world-twenty-four-points-node-op-text--active {
  fill: var(--pico-on-accent);
}

.pico-world-twenty-four-points-node-card-rect {
  fill: var(--pico-surface-raised);
  stroke: var(--pico-hairline);
  stroke-width: 1.5;
}

.pico-world-twenty-four-points-node-card-rect--active {
  stroke: var(--pico-accent);
  stroke-width: 2.5;
}

.pico-world-twenty-four-points-node-card-rank {
  font-family: var(--pico-font-mono);
  font-size: 15px;
  font-weight: 700;
  fill: var(--pico-ink);
  text-anchor: middle;
  dominant-baseline: central;
}

.pico-world-twenty-four-points-node-card-suit {
  font-size: 13px;
  text-anchor: middle;
  dominant-baseline: central;
}

.pico-world-twenty-four-points-node-result-badge {
  fill: var(--pico-hue-fn-bg);
  stroke: var(--pico-hue-fn-strong);
  stroke-width: 1.5;
}

.pico-world-twenty-four-points-node-result-badge--success {
  fill: var(--pico-hue-branch-bg);
  stroke: var(--pico-hue-branch-strong);
  stroke-width: 2;
}

.pico-world-twenty-four-points-node-result-text {
  font-family: var(--pico-font-mono);
  font-size: 13px;
  font-weight: 700;
  fill: var(--pico-hue-fn-ink);
  text-anchor: middle;
  dominant-baseline: central;
}

.pico-world-twenty-four-points-node-result-text--success {
  fill: var(--pico-hue-branch-ink);
}

/* turtle-polygon-loop 课程局部样式 */
.pico-world-turtle-polygon-loop-hint {
  display: flex;
  flex-direction: column;
  gap: var(--pico-space-1);
  font-size: var(--pico-size-sm);
  color: var(--pico-ink-soft);
}

.pico-world-turtle-polygon-loop-formula {
  font-family: var(--pico-font-mono);
  font-size: var(--pico-size-code);
  font-weight: 600;
  color: var(--pico-accent-deep);
}

.pico-world-turtle-polygon-loop-subhint {
  font-size: var(--pico-size-xs);
  line-height: 1.4;
  color: var(--pico-ink-soft);
}

/* tower-of-hanoi 课程局部样式 */
.pico-world-tower-of-hanoi-shell {
  grid-template-columns: 40fr 60fr;
}

.pico-world-tower-of-hanoi-tools {
  display: flex;
  align-items: center;
  gap: var(--pico-space-3);
  padding: var(--pico-space-3) var(--pico-space-4);
  border-top: var(--pico-line);
  background: var(--pico-surface);
  font-size: var(--pico-size-sm);
  color: var(--pico-ink-soft);
}

.pico-world-tower-of-hanoi-slider-wrap {
  display: flex;
  align-items: center;
  gap: var(--pico-space-2);
  flex: 1;
}

.pico-world-tower-of-hanoi-slider {
  flex: 1;
  cursor: pointer;
}

.pico-world-tower-of-hanoi-slider-val {
  min-width: 1.5em;
  font-weight: 600;
  font-family: var(--pico-font-mono);
  color: var(--pico-accent-deep);
}

.pico-world-tower-of-hanoi-scene {
  position: relative;
  display: flex;
  flex: 1;
  min-height: 0;
  width: 100%;
  height: 100%;
  align-items: center;
  justify-content: center;
  background: var(--pico-paper);
  overflow: hidden;
}

.pico-world-tower-of-hanoi-svg {
  width: 100%;
  height: 100%;
  max-height: 100%;
  user-select: none;
}

.pico-world-tower-of-hanoi-peg-pole {
  stroke: var(--pico-hairline);
  stroke-width: 6;
  stroke-linecap: round;
}

.pico-world-tower-of-hanoi-peg-base {
  stroke: var(--pico-hairline);
  stroke-width: 4;
  stroke-linecap: round;
}

.pico-world-tower-of-hanoi-peg-label {
  fill: var(--pico-ink-soft);
  font-family: var(--pico-font-ui);
  font-size: 16px;
  font-weight: 700;
  text-anchor: middle;
}

.pico-world-tower-of-hanoi-disk {
  rx: 6;
  ry: 6;
}

.pico-world-tower-of-hanoi-disk-1 { fill: var(--pico-syn-key); }
.pico-world-tower-of-hanoi-disk-2 { fill: var(--pico-syn-str); }
.pico-world-tower-of-hanoi-disk-3 { fill: var(--pico-syn-num); }
.pico-world-tower-of-hanoi-disk-4 { fill: var(--pico-hue-fn-strong); }
.pico-world-tower-of-hanoi-disk-5 { fill: var(--pico-accent-deep); }

.pico-world-tower-of-hanoi-disk--pending {
  fill: transparent;
  stroke: var(--pico-accent);
  stroke-width: 2;
  stroke-dasharray: 6 4;
}

.pico-world-tower-of-hanoi-disk-label {
  fill: var(--pico-on-accent);
  font-family: var(--pico-font-mono);
  font-size: 13px;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: central;
}

.pico-world-tower-of-hanoi-disk-label--pending {
  fill: var(--pico-accent);
}

.pico-world-tower-of-hanoi-arrow {
  fill: none;
  stroke: var(--pico-accent);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 5 3;
}

.pico-world-tower-of-hanoi-arrow-head {
  fill: var(--pico-accent);
  stroke: var(--pico-accent);
  stroke-width: 1;
}

.pico-world-tower-of-hanoi-error-cross {
  stroke: var(--pico-hue-error-strong);
  stroke-width: 7;
  stroke-linecap: round;
}

.pico-world-tower-of-hanoi-error-text {
  fill: var(--pico-hue-error-strong);
  font-family: var(--pico-font-ui);
  font-size: 15px;
  font-weight: 600;
  text-anchor: middle;
}

.pico-world-tower-of-hanoi-callstack {
  position: absolute;
  top: var(--pico-space-3);
  right: var(--pico-space-3);
  z-index: 3;
  width: 220px;
  max-height: 140px;
  overflow-y: auto;
  padding: 8px 10px;
  border: var(--pico-line);
  border-radius: var(--pico-radius);
  background: var(--pico-surface-raised);
  box-shadow: var(--pico-shadow);
  font-family: var(--pico-font-mono);
  font-size: var(--pico-size-xs);
}

.pico-world-tower-of-hanoi-callstack-title {
  display: block;
  margin-bottom: 4px;
  font-family: var(--pico-font-ui);
  font-size: var(--pico-size-xs);
  font-weight: 700;
  color: var(--pico-ink-soft);
  border-bottom: var(--pico-line);
  padding-bottom: 2px;
}

.pico-world-tower-of-hanoi-callstack-item {
  padding: 2px 4px;
  border-radius: var(--pico-radius-sm);
  color: var(--pico-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pico-world-tower-of-hanoi-callstack-item--top {
  background: var(--pico-accent-wash);
  color: var(--pico-accent-deep);
  font-weight: 600;
}

.pico-world-tower-of-hanoi-callstack-empty {
  color: var(--pico-ink-soft);
  font-style: italic;
}


/* pixel-threshold-loop 课程局部样式 */
.pico-world-pixel-threshold-loop-stage {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 256px;
  height: 256px;
  max-width: calc(100% - 32px);
  max-height: calc(100% - 32px);
  aspect-ratio: 1;
  border-radius: var(--pico-radius);
  border: var(--pico-line);
  background: var(--pico-surface);
  box-shadow: var(--pico-shadow);
  overflow: hidden;
}

.pico-world-pixel-threshold-loop-stage .pico-image-canvas {
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  display: block;
}

.pico-world-pixel-threshold-loop-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.pico-world-pixel-threshold-loop-grid {
  stroke: var(--pico-hairline);
  stroke-width: 0.04;
  opacity: 0.5;
}

.pico-world-pixel-threshold-loop-focus {
  fill: none;
  stroke: var(--pico-accent);
  stroke-width: 0.12;
  rx: 0.08;
  transition: x var(--pico-duration-fast), y var(--pico-duration-fast);
}

.pico-world-pixel-threshold-loop-focus[hidden] {
  display: none;
}

.pico-world-pixel-threshold-loop-hint {
  font-size: var(--pico-size-sm);
  color: var(--pico-ink-soft);
  line-height: 1.5;
}

/* world3d-robot-route 课程局部样式 */
.pico-world-world3d-robot-route-hint {
  display: flex;
  flex-direction: column;
  gap: var(--pico-space-1);
  padding: var(--pico-space-3) var(--pico-space-4);
  border-top: var(--pico-line);
  background: var(--pico-surface);
  font-size: var(--pico-size-sm);
  color: var(--pico-ink-soft);
  line-height: 1.5;
}

.pico-world-world3d-robot-route-hint strong {
  color: var(--pico-ink);
  font-weight: 600;
}

.pico-world-world3d-robot-route-status--success {
  background: var(--pico-hue-branch-bg);
  color: var(--pico-hue-branch-ink);
  border-color: var(--pico-hue-branch-strong);
  font-weight: 600;
}

.pico-world-world3d-robot-route-status--warn {
  background: var(--pico-hue-loop-bg);
  color: var(--pico-hue-loop-ink);
  border-color: var(--pico-hue-loop-strong);
}

.pico-world-world3d-robot-route-status--error {
  background: var(--pico-hue-error-bg);
  color: var(--pico-hue-error-ink);
  border-color: var(--pico-hue-error-strong);
  font-weight: 600;
}

/* ascii-coin-maze 课程局部样式 */
.pico-world-ascii-coin-maze-hint {
  display: flex;
  flex-direction: column;
  gap: var(--pico-space-1);
  font-size: var(--pico-size-sm);
  color: var(--pico-ink-soft);
  line-height: 1.5;
}

.pico-world-ascii-coin-maze-hint-text {
  font-size: var(--pico-size-xs);
  line-height: 1.4;
  color: var(--pico-ink-soft);
}

.pico-world-ascii-coin-maze-scene .pico-ascii-cell[data-char="@"] {
  background: var(--pico-accent-wash);
  color: var(--pico-accent);
  border-color: var(--pico-accent);
  box-shadow: 0 0 0 1px var(--pico-accent);
  font-weight: 700;
}

.pico-world-ascii-coin-maze-scene .pico-ascii-cell[data-char="$"] {
  background: color-mix(in srgb, var(--pico-syn-num) 16%, var(--pico-surface-raised));
  color: var(--pico-syn-num);
  border-color: var(--pico-syn-num);
  font-weight: 700;
}

.pico-world-ascii-coin-maze-scene .pico-ascii-cell[data-char="O"] {
  background: var(--pico-surface);
  color: var(--pico-ink-soft);
  border-color: var(--pico-hairline);
  font-weight: 600;
}

.pico-world-ascii-coin-maze-status-coin--collected {
  background: var(--pico-hue-branch-bg);
  color: var(--pico-hue-branch-ink);
  border-color: var(--pico-hue-branch-strong);
  font-weight: 600;
}
</style>
</head>
